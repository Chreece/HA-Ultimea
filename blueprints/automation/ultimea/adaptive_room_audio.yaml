blueprint:
  name: ULTIMEA Adaptive Room Audio
  description: >-
    Room-aware automation for ULTIMEA soundbars. It can learn a normal and quiet
    volume, lower volume during quiet hours / TTS / active binary conditions /
    Assist activity, fade only around the quiet-hours boundaries, select Night
    mode, and follow the content playing on a connected media player.

    Minimum and maximum volume can be fixed percentages or read from optional
    numeric entities. When manual-volume learning is enabled and the selected
    source is a writable input_number/number entity, a manual volume change in a
    normal or minimum-volume regime updates that endpoint. Manual changes during
    a quiet-hours fade stop the fade for that soundbar instead of being learned.

    "Room-list" entities may expose rooms in their state as comma-separated area
    IDs/names/entity IDs, or in attributes as lists or comma-separated strings.
    Any token that resolves to the same area as a soundbar requests minimum volume.
    The special values `all` and `*` apply globally.

    Optional audio-input selector entities are paired to soundbars by Home
    Assistant area. The entity picker can be searched by friendly name/label;
    Home Assistant stores the selected entity ID. Exactly one selector must match
    a soundbar area, so unassigned or ambiguous selectors never act globally.

    Optional per-zone normal-volume entities use the same area matching. Exactly
    one numeric entity in a soundbar's area overrides the global maximum/normal
    volume for that soundbar. An input_number helper therefore gives that zone its
    own persistent dashboard slider. No-area or ambiguous matches fall back to the
    global maximum, and the quiet/minimum endpoint remains global.

    Automatic restore/handoff changes use guarded fixed-step transitions. There
    is no permanent polling trigger: the automation starts one fade run only when
    a configured transition window begins, then waits five seconds between steps
    inside that active run. Outside a transition it sleeps until a real state/time
    event occurs. Direct minimum-volume requests remain immediate.

    EQ follow uses media-player state plus common content attributes such as
    app_name, media_title, media_content_type and source. Optional classifier
    entities can provide labels such as Movie, Music, Voice, Sport or Game. An
    optional action hook can run a snapshot/AI classifier first; the hook is
    provider-agnostic and should update one of the selected classifier entities.
  domain: automation
  source_url: https://github.com/Chreece/HA-Ultimea/blob/master/blueprints/automation/ultimea/adaptive_room_audio.yaml
  homeassistant:
    min_version: 2026.7.0
  input:
    soundbars:
      name: Soundbars and persistent volume limits
      icon: mdi:soundbar
      collapsed: false
      input:
        ultimea_players:
          name: ULTIMEA soundbars
          description: Select the ULTIMEA media_player entities this automation controls.
          selector:
            entity:
              multiple: true
              filter:
                - integration: ultimea
                  domain: media_player
        audio_input_selectors:
          name: Audio-input selectors (optional)
          description: >-
            Select input_select/select entities used to choose each soundbar's
            audio source. Home Assistant's entity picker can be searched by the
            entity's friendly name/label while the blueprint stores its entity ID.
            Put each selector in the same Home Assistant area as its soundbar.
            Exactly one selector must match a soundbar area; selectors without an
            area and ambiguous same-area matches are ignored.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_select
                    - select
        min_volume_value:
          name: Minimum volume
          description: >-
            Fixed quiet/TTS/Assist volume in percent. Used when no minimum-volume
            entity is selected below.
          default: 20
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        min_volume_helper:
          name: Minimum volume entity (optional)
          description: >-
            Optional numeric entity whose state overrides the fixed minimum above.
            input_number and number entities can also be updated by manual-volume
            learning; sensor entities are read-only. Values may use 0–1 or 0–100.
            Select at most one entity.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_number
                    - number
                    - sensor
        max_volume_value:
          name: Maximum volume
          description: >-
            Fixed normal-operation volume in percent. Used when no maximum-volume
            entity is selected below.
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        max_volume_helper:
          name: Maximum volume entity (optional)
          description: >-
            Optional numeric entity whose state overrides the fixed maximum above.
            input_number and number entities can also be updated by manual-volume
            learning; sensor entities are read-only. Values may use 0–1 or 0–100.
            Select at most one entity.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_number
                    - number
                    - sensor
        zone_volume_entities:
          name: Per-zone normal-volume entities (optional)
          description: >-
            Optional numeric entities that override the global maximum/normal
            volume per soundbar area. Put each entity in the same Home Assistant
            area as its soundbar. Exactly one entity must match an area; no-area
            and ambiguous matches fall back to the global maximum above.
            input_number and number entities can learn manual normal-volume changes;
            sensor entities are read-only. Values may use 0–1 or 0–100. An
            input_number helper can be exposed as that zone's dashboard slider.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_number
                    - number
                    - sensor

    quiet_hours:
      name: Quiet hours
      icon: mdi:weather-night
      collapsed: false
      input:
        quiet_start:
          name: Quiet hours start
          default: "22:00:00"
          selector:
            time: {}
        quiet_end:
          name: Quiet hours end
          default: "07:00:00"
          selector:
            time: {}
        transition_before:
          name: Fade before quiet hours
          description: >-
            Time before quiet hours during which volume moves smoothly from the
            learned maximum to the learned minimum.
          default:
            hours: 0
            minutes: 30
            seconds: 0
          selector:
            duration:
              enable_day: false
              enable_second: true
        transition_after:
          name: Fade after quiet hours
          description: >-
            Time after quiet hours during which volume moves smoothly from the
            learned minimum to the learned maximum.
          default:
            hours: 0
            minutes: 30
            seconds: 0
          selector:
            duration:
              enable_day: false
              enable_second: true
        handoff_transition:
          name: Guarded handoff / restore duration
          description: >-
            Duration used when automation control returns to a non-urgent target,
            for example after ducking ends or after a manually interrupted quiet-
            hours fade reaches its boundary. The transition always uses fixed
            five-second steps. If the actual volume stops matching the expected
            intermediate value, the handoff stops instead of fighting the user.
            Values shorter than five seconds are clamped to one five-second
            interval so a handoff never becomes a single abrupt jump.
          default:
            hours: 0
            minutes: 0
            seconds: 15
          selector:
            duration:
              enable_day: false
              enable_second: true

    low_volume_conditions:
      name: Conditions that request minimum volume
      icon: mdi:volume-low
      collapsed: true
      input:
        low_volume_binary_entities:
          name: Binary entities
          description: >-
            Selected binary_sensor/input_boolean entities lower soundbars in the
            same area. Entities without an area are treated as global.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
        list_state_entities:
          name: Room-list entities (state or attributes)
          description: >-
            Entities may provide active rooms in their state as comma-separated
            area IDs/names/entity IDs, or in attributes as a list or a comma-
            separated string. Matching a soundbar's area requests minimum volume.
            `all` or `*` applies to every selected bar.
          default: []
          selector:
            entity:
              multiple: true
        tts_media_players:
          name: TTS / announcement media players
          description: >-
            When a selected media player is playing or buffering, soundbars in
            the same area are lowered. Media players without an area are global.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        voice_assistants:
          name: Voice assistants
          description: >-
            Assist Satellite entities. Any state other than idle lowers a bar in
            the same area. Satellites without an area are global.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: assist_satellite
        night_mode_entities:
          name: Night-mode booleans / binary sensors
          description: >-
            When on, these request both minimum volume and ULTIMEA Night mode for
            the same area. Entities without an area are global.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean

    content_follow:
      name: Connected content and EQ follow
      icon: mdi:movie-open-play
      collapsed: true
      input:
        connected_media_players:
          name: Devices connected to the soundbar
          description: >-
            Select TVs, streamers, consoles or other media_player entities whose
            current app/content should drive the ULTIMEA sound mode. Area
            assignment is used to pair them to each soundbar; entities without an
            area are treated as global.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        content_classifier_entities:
          name: Optional content / AI classifier entities
          description: >-
            Optional entities whose state or common label attributes contain a
            content class such as Movie, Music, Voice, Sport or Game. Area
            assignment is respected; entities without an area are global.
          default: []
          selector:
            entity:
              multiple: true
        ai_content_actions:
          name: Optional snapshot / AI classification actions
          description: >-
            Optional actions run when a connected media player changes. Use this
            hook to take a snapshot and call any AI/vision integration, then write
            the result to one of the classifier entities above. Leave empty when
            media metadata is enough.
          default: []
          selector:
            action: {}
        eq_fallback_mode:
          name: EQ fallback when content is unknown
          default: No change
          selector:
            select:
              options:
                - No change
                - Movie
                - Music
                - Voice
                - Sport
                - Game
        normal_sound_mode:
          name: Mode to restore after Night when EQ follow is off
          description: >-
            Used only when Night mode is enabled and EQ follow is disabled or has
            no classification. `No change` leaves the current mode untouched.
          default: Movie
          selector:
            select:
              options:
                - No change
                - Movie
                - Music
                - Voice
                - Sport
                - Game
        game_keywords:
          name: Game keywords
          default: "game,gaming,playstation,xbox,nintendo,steam,geforce now"
          selector:
            text: {}
        sport_keywords:
          name: Sport keywords
          default: "sport,sports,football,soccer,basketball,tennis,formula 1,f1,nfl,nba,uefa"
          selector:
            text: {}
        voice_keywords:
          name: Voice keywords
          default: "voice,speech,talk,podcast,audiobook,news"
          selector:
            text: {}
        music_keywords:
          name: Music keywords
          default: "music,audio,song,album,spotify,tidal,deezer,music assistant,youtube music"
          selector:
            text: {}
        movie_keywords:
          name: Movie / TV keywords
          default: "movie,film,video,tv,episode,series,netflix,prime video,disney,plex,jellyfin,kodi"
          selector:
            text: {}

    options:
      name: Features to apply
      icon: mdi:tune-variant
      collapsed: false
      input:
        apply_volume_follow:
          name: Volume follow
          description: Apply min/max volume and quiet-hour fades.
          default: true
          selector:
            boolean: {}
        learn_manual_volume_changes:
          name: Learn min/max from manual volume changes
          description: >-
            When enabled, manual soundbar volume changes update the active minimum
            or maximum only when that endpoint uses a writable input_number/number
            entity. Manual changes during a quiet-hours fade never change an
            endpoint; they stop that fade for the affected soundbar.
          default: false
          selector:
            boolean: {}
        apply_night_mode:
          name: Night mode
          description: Select ULTIMEA Night mode during quiet hours or a night-mode boolean.
          default: true
          selector:
            boolean: {}
        apply_eq_follow:
          name: EQ follow
          description: Select Movie/Music/Voice/Sport/Game from connected content metadata/classification.
          default: false
          selector:
            boolean: {}

variables:
  ultimea_players: !input ultimea_players
  audio_input_selectors: !input audio_input_selectors
  min_volume_value: !input min_volume_value
  min_volume_source_input: !input min_volume_helper
  max_volume_value: !input max_volume_value
  max_volume_source_input: !input max_volume_helper
  zone_volume_entities: !input zone_volume_entities
  quiet_start_time: !input quiet_start
  quiet_end_time: !input quiet_end
  transition_before_value: !input transition_before
  transition_after_value: !input transition_after
  handoff_transition_value: !input handoff_transition
  low_volume_binary_entities: !input low_volume_binary_entities
  list_state_entities: !input list_state_entities
  tts_media_players: !input tts_media_players
  voice_assistants: !input voice_assistants
  night_mode_entities: !input night_mode_entities
  connected_media_players: !input connected_media_players
  content_classifier_entities: !input content_classifier_entities
  eq_fallback_mode: !input eq_fallback_mode
  normal_sound_mode: !input normal_sound_mode
  game_keywords: !input game_keywords
  sport_keywords: !input sport_keywords
  voice_keywords: !input voice_keywords
  music_keywords: !input music_keywords
  movie_keywords: !input movie_keywords
  apply_volume_follow: !input apply_volume_follow
  learn_manual_volume_changes: !input learn_manual_volume_changes
  apply_night_mode: !input apply_night_mode
  apply_eq_follow: !input apply_eq_follow

trigger_variables:
  quiet_start_trigger_time: !input quiet_start
  transition_before_trigger_value: !input transition_before
  volume_follow_trigger_enabled: !input apply_volume_follow

triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time
    at: !input quiet_start
    id: quiet_start
  - trigger: time
    at: !input quiet_end
    id: quiet_end
  - trigger: template
    value_template: >-
      {% set p = quiet_start_trigger_time.split(':') | map('int') | list %}
      {% set quiet_start_s = p[0] * 3600 + p[1] * 60
         + (p[2] if p | length > 2 else 0) %}
      {% set before_s =
         (transition_before_trigger_value.get('hours', 0) | int) * 3600
         + (transition_before_trigger_value.get('minutes', 0) | int) * 60
         + (transition_before_trigger_value.get('seconds', 0) | int) %}
      {% set current_s = now().hour * 3600 + now().minute * 60 + now().second %}
      {% set until_start = (quiet_start_s - current_s + 86400) % 86400 %}
      {{ volume_follow_trigger_enabled and before_s > 0
         and 0 < until_start <= before_s }}
    id: transition_before_start
  - trigger: state
    entity_id: !input ultimea_players
    to: null
    id: bar_state_change
  - trigger: state
    entity_id: !input ultimea_players
    attribute: volume_level
    id: bar_volume_change
    enabled: !input learn_manual_volume_changes
  - trigger: state
    entity_id: !input min_volume_helper
    id: volume_source
  - trigger: state
    entity_id: !input max_volume_helper
    id: volume_source
  - trigger: state
    entity_id: !input zone_volume_entities
    id: volume_source
  - trigger: state
    entity_id: !input audio_input_selectors
    id: audio_input_change
  - trigger: state
    entity_id: !input low_volume_binary_entities
    id: low_binary_change
  - trigger: state
    entity_id: !input list_state_entities
    id: list_change
  - trigger: state
    entity_id: !input tts_media_players
    id: tts_change
  - trigger: state
    entity_id: !input voice_assistants
    id: voice_change
  - trigger: state
    entity_id: !input night_mode_entities
    id: night_override_change
  - trigger: state
    entity_id: !input connected_media_players
    id: connected_change
  - trigger: state
    entity_id: !input content_classifier_entities
    id: classifier_change

conditions: []

actions:
  - variables:
      trigger_id: "{{ trigger.id | default('') }}"
      trigger_entity: >-
        {{ trigger.entity_id if trigger is defined and trigger.platform == 'state' else '' }}
      now_seconds: >-
        {{ now().hour * 3600 + now().minute * 60 + now().second }}
      quiet_start_seconds: >-
        {% set p = quiet_start_time.split(':') | map('int') | list %}
        {{ p[0] * 3600 + p[1] * 60 + (p[2] if p | length > 2 else 0) }}
      quiet_end_seconds: >-
        {% set p = quiet_end_time.split(':') | map('int') | list %}
        {{ p[0] * 3600 + p[1] * 60 + (p[2] if p | length > 2 else 0) }}
      transition_before_seconds: >-
        {{ (transition_before_value.get('hours', 0) | int) * 3600
           + (transition_before_value.get('minutes', 0) | int) * 60
           + (transition_before_value.get('seconds', 0) | int) }}
      transition_after_seconds: >-
        {{ (transition_after_value.get('hours', 0) | int) * 3600
           + (transition_after_value.get('minutes', 0) | int) * 60
           + (transition_after_value.get('seconds', 0) | int) }}
      handoff_transition_seconds: >-
        {{ (handoff_transition_value.get('hours', 0) | int) * 3600
           + (handoff_transition_value.get('minutes', 0) | int) * 60
           + (handoff_transition_value.get('seconds', 0) | int) }}
      min_volume_entity: >-
        {% if min_volume_source_input is string %}
          {{ min_volume_source_input }}
        {% elif min_volume_source_input | length > 0 %}
          {{ min_volume_source_input[0] }}
        {% else %}
          {{ '' }}
        {% endif %}
      max_volume_entity: >-
        {% if max_volume_source_input is string %}
          {{ max_volume_source_input }}
        {% elif max_volume_source_input | length > 0 %}
          {{ max_volume_source_input[0] }}
        {% else %}
          {{ '' }}
        {% endif %}
      min_volume_candidate: >-
        {% if min_volume_entity %}
          {% set raw = states(min_volume_entity) | float(min_volume_value | float(20)) %}
          {% set scale = state_attr(min_volume_entity, 'max') | float(0) %}
          {% set normalized = raw / 100 if scale > 1.5 or raw > 1.5 else raw %}
        {% else %}
          {% set normalized = (min_volume_value | float(20)) / 100 %}
        {% endif %}
        {{ [[normalized, 0.0] | max, 1.0] | min }}
      max_volume_candidate: >-
        {% if max_volume_entity %}
          {% set raw = states(max_volume_entity) | float(max_volume_value | float(50)) %}
          {% set scale = state_attr(max_volume_entity, 'max') | float(0) %}
          {% set normalized = raw / 100 if scale > 1.5 or raw > 1.5 else raw %}
        {% else %}
          {% set normalized = (max_volume_value | float(50)) / 100 %}
        {% endif %}
        {{ [[normalized, 0.0] | max, 1.0] | min }}
      room_list_area_ids: >-
        {% set ns = namespace(area_ids=[]) %}
        {% for holder in list_state_entities %}
          {% set obj = expand(holder) | first %}
          {% if obj is not none %}
            {% for raw in (obj.state | string).split(',') %}
              {% set token = raw | trim %}
              {% if token %}
                {% if token | lower in ['all', '*'] %}
                  {% set ns.area_ids = ns.area_ids + ['*'] %}
                {% else %}
                  {% set resolved = token if token in areas() else area_id(token) %}
                  {% if resolved %}
                    {% set ns.area_ids = ns.area_ids + [resolved] %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% for value in obj.attributes.values() %}
              {% if value is string and ',' in value %}
                {% for raw in value.split(',') %}
                  {% set token = raw | trim %}
                  {% if token %}
                    {% if token | lower in ['all', '*'] %}
                      {% set ns.area_ids = ns.area_ids + ['*'] %}
                    {% else %}
                      {% set resolved = token if token in areas() else area_id(token) %}
                      {% if resolved %}
                        {% set ns.area_ids = ns.area_ids + [resolved] %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% elif value is iterable and value is not string and value is not mapping %}
                {% for raw in value %}
                  {% set token = raw | string | trim %}
                  {% if token %}
                    {% if token | lower in ['all', '*'] %}
                      {% set ns.area_ids = ns.area_ids + ['*'] %}
                    {% else %}
                      {% set resolved = token if token in areas() else area_id(token) %}
                      {% if resolved %}
                        {% set ns.area_ids = ns.area_ids + [resolved] %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {{ ns.area_ids | unique | list }}

  - variables:
      quiet_hours_enabled: "{{ quiet_start_seconds != quiet_end_seconds }}"
      in_quiet_hours: >-
        {% if quiet_start_seconds == quiet_end_seconds %}
          false
        {% elif quiet_start_seconds < quiet_end_seconds %}
          {{ quiet_start_seconds <= now_seconds < quiet_end_seconds }}
        {% else %}
          {{ now_seconds >= quiet_start_seconds or now_seconds < quiet_end_seconds }}
        {% endif %}
      seconds_until_quiet_start: >-
        {{ (quiet_start_seconds - now_seconds + 86400) % 86400 }}
      seconds_since_quiet_end: >-
        {{ (now_seconds - quiet_end_seconds + 86400) % 86400 }}
      min_volume: "{{ [min_volume_candidate, max_volume_candidate] | min }}"
      max_volume: "{{ [min_volume_candidate, max_volume_candidate] | max }}"

  - variables:
      before_transition_active: >-
        {{ quiet_hours_enabled
           and not in_quiet_hours
           and transition_before_seconds > 0
           and 0 < seconds_until_quiet_start <= transition_before_seconds }}
      after_transition_active: >-
        {{ quiet_hours_enabled
           and not in_quiet_hours
           and transition_after_seconds > 0
           and seconds_since_quiet_end < transition_after_seconds }}
      scheduled_volume: >-
        {% if in_quiet_hours %}
          {{ min_volume }}
        {% elif quiet_hours_enabled
                and transition_before_seconds > 0
                and 0 < seconds_until_quiet_start <= transition_before_seconds %}
          {% set progress = 1 - (seconds_until_quiet_start / transition_before_seconds) %}
          {{ max_volume - ((max_volume - min_volume) * progress) }}
        {% elif quiet_hours_enabled
                and transition_after_seconds > 0
                and seconds_since_quiet_end < transition_after_seconds %}
          {% set progress = seconds_since_quiet_end / transition_after_seconds %}
          {{ min_volume + ((max_volume - min_volume) * progress) }}
        {% else %}
          {{ max_volume }}
        {% endif %}
      previous_scheduled_volume: >-
        {% if before_transition_active and transition_before_seconds > 0 %}
          {% set step = ((max_volume - min_volume) * 5 / transition_before_seconds) %}
          {{ [max_volume, scheduled_volume + step] | min }}
        {% elif after_transition_active and transition_after_seconds > 0 %}
          {% set step = ((max_volume - min_volume) * 5 / transition_after_seconds) %}
          {{ [min_volume, scheduled_volume - step] | max }}
        {% else %}
          {{ scheduled_volume }}
        {% endif %}
      bar_volume_changed: >-
        {{ trigger_id == 'bar_volume_change'
           and trigger.from_state is not none
           and trigger.to_state is not none
           and trigger.from_state.attributes.get('volume_level') != trigger.to_state.attributes.get('volume_level')
           and trigger.to_state.attributes.get('volume_level') is not none }}
      bar_volume_trigger_is_current: >-
        {{ bar_volume_changed
           and state_attr(trigger_entity, 'volume_level') is not none
           and (state_attr(trigger_entity, 'volume_level') | float(0)
                - trigger.to_state.attributes.get('volume_level') | float(0)) | abs <= 0.004 }}
      bar_became_on: >-
        {{ trigger_id == 'bar_state_change'
           and trigger.from_state is not none
           and trigger.to_state is not none
           and trigger.from_state.state != 'on'
           and trigger.to_state.state == 'on' }}

  # A current volume attribute change on an ULTIMEA media player is special:
  # if it is not the value this blueprint currently calculates, treat it as a
  # manual adjustment and learn it into the active endpoint. Queued stale events
  # from intermediate handoff steps are ignored once the live volume has moved on.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ apply_volume_follow and bar_volume_changed
                 and bar_volume_trigger_is_current }}
        sequence:
          - variables:
              manual_bar: "{{ trigger_entity }}"
              manual_bar_area: "{{ area_id(trigger_entity) or '' }}"
              manual_binary_low: >-
                {% set ns = namespace(active=false) %}
                {% for entity in low_volume_binary_entities %}
                  {% set entity_area = area_id(entity) or '' %}
                  {% if is_state(entity, 'on')
                        and (entity_area == '' or (manual_bar_area != '' and entity_area == manual_bar_area)) %}
                    {% set ns.active = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.active }}
              manual_tts_low: >-
                {% set ns = namespace(active=false) %}
                {% for entity in tts_media_players %}
                  {% set entity_area = area_id(entity) or '' %}
                  {% if states(entity) in ['playing', 'buffering']
                        and (entity_area == '' or (manual_bar_area != '' and entity_area == manual_bar_area)) %}
                    {% set ns.active = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.active }}
              manual_voice_low: >-
                {% set ns = namespace(active=false) %}
                {% for entity in voice_assistants %}
                  {% set entity_area = area_id(entity) or '' %}
                  {% if states(entity) not in ['idle', 'unknown', 'unavailable']
                        and (entity_area == '' or (manual_bar_area != '' and entity_area == manual_bar_area)) %}
                    {% set ns.active = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.active }}
              manual_night_override: >-
                {% set ns = namespace(active=false) %}
                {% for entity in night_mode_entities %}
                  {% set entity_area = area_id(entity) or '' %}
                  {% if is_state(entity, 'on')
                        and (entity_area == '' or (manual_bar_area != '' and entity_area == manual_bar_area)) %}
                    {% set ns.active = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.active }}
              manual_list_low: >-
                {{ '*' in room_list_area_ids
                   or (manual_bar_area != '' and manual_bar_area in room_list_area_ids) }}
              manual_zone_volume_matches: >-
                {% set ns = namespace(matches=[]) %}
                {% set candidates = [zone_volume_entities]
                   if zone_volume_entities is string else zone_volume_entities %}
                {% if manual_bar_area != '' %}
                  {% for entity in candidates %}
                    {% if (area_id(entity) or '') == manual_bar_area %}
                      {% set ns.matches = ns.matches + [entity] %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
                {{ ns.matches }}
              manual_zone_volume_entity: >-
                {{ manual_zone_volume_matches[0]
                   if manual_zone_volume_matches | length == 1 else '' }}
          - variables:
              manual_extra_low: >-
                {{ manual_binary_low or manual_tts_low or manual_voice_low
                   or manual_night_override or manual_list_low }}
              manual_zone_max_candidate: >-
                {% if manual_zone_volume_entity %}
                  {% set scale = state_attr(manual_zone_volume_entity, 'max') | float(0) %}
                  {% set fallback = max_volume * 100 if scale > 1.5 else max_volume %}
                  {% set raw = states(manual_zone_volume_entity) | float(fallback) %}
                  {% set normalized = raw / 100 if scale > 1.5 or raw > 1.5 else raw %}
                  {{ [[normalized, 0.0] | max, 1.0] | min }}
                {% else %}
                  {{ max_volume }}
                {% endif %}
              manual_max_volume: >-
                {{ [min_volume, manual_zone_max_candidate] | max }}
              manual_scheduled_volume: >-
                {% if in_quiet_hours %}
                  {{ min_volume }}
                {% elif before_transition_active and transition_before_seconds > 0 %}
                  {% set progress = 1 - (seconds_until_quiet_start / transition_before_seconds) %}
                  {{ manual_max_volume - ((manual_max_volume - min_volume) * progress) }}
                {% elif after_transition_active and transition_after_seconds > 0 %}
                  {% set progress = seconds_since_quiet_end / transition_after_seconds %}
                  {{ min_volume + ((manual_max_volume - min_volume) * progress) }}
                {% else %}
                  {{ manual_max_volume }}
                {% endif %}
              manual_previous_scheduled_volume: >-
                {% if before_transition_active and transition_before_seconds > 0 %}
                  {% set step = ((manual_max_volume - min_volume) * 5 / transition_before_seconds) %}
                  {{ [manual_max_volume, manual_scheduled_volume + step] | min }}
                {% elif after_transition_active and transition_after_seconds > 0 %}
                  {% set step = ((manual_max_volume - min_volume) * 5 / transition_after_seconds) %}
                  {{ [min_volume, manual_scheduled_volume - step] | max }}
                {% else %}
                  {{ manual_scheduled_volume }}
                {% endif %}
              manual_expected_volume: >-
                {{ min_volume if manual_extra_low else manual_scheduled_volume }}
              manual_volume: >-
                {{ trigger.to_state.attributes.get('volume_level') | float(0) }}
              manual_is_low_regime: >-
                {{ in_quiet_hours or manual_extra_low }}
              manual_in_time_transition: >-
                {{ (before_transition_active or after_transition_active) and not manual_extra_low }}
              manual_differs_from_expected: >-
                {{ (manual_volume - manual_expected_volume) | abs > 0.004
                   and (not manual_in_time_transition
                        or (manual_volume - manual_previous_scheduled_volume) | abs > 0.004) }}
              manual_learning_entity: >-
                {{ min_volume_entity if manual_is_low_regime
                   else (manual_zone_volume_entity if manual_zone_volume_entity else max_volume_entity) }}
              manual_learning_domain: >-
                {{ manual_learning_entity.split('.', 1)[0] if manual_learning_entity else '' }}
              manual_learning_value: >-
                {% if manual_learning_entity %}
                  {% set scale = state_attr(manual_learning_entity, 'max') | float(0) %}
                  {% set current = states(manual_learning_entity) | float(0) %}
                  {{ (manual_volume * 100 if scale > 1.5 or current > 1.5 else manual_volume) | round(2) }}
                {% else %}
                  {{ manual_volume | round(2) }}
                {% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ manual_differs_from_expected
                         and not manual_in_time_transition
                         and learn_manual_volume_changes
                         and manual_learning_domain == 'input_number' }}
                sequence:
                  - action: input_number.set_value
                    continue_on_error: true
                    target:
                      entity_id: "{{ manual_learning_entity }}"
                    data:
                      value: "{{ manual_learning_value }}"
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ manual_differs_from_expected
                         and not manual_in_time_transition
                         and learn_manual_volume_changes
                         and manual_learning_domain == 'number' }}
                sequence:
                  - action: number.set_value
                    continue_on_error: true
                    target:
                      entity_id: "{{ manual_learning_entity }}"
                    data:
                      value: "{{ manual_learning_value }}"
          - stop: Manual ULTIMEA volume change handled without fighting the user.

  # Ignore unrelated ULTIMEA attribute changes. The one exception is a bar
  # becoming ON, when the current room policy should be applied once.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger_id == 'bar_state_change' and not bar_became_on }}"
        sequence:
          - stop: ULTIMEA state change left untouched.

  # Volume policy. Quiet-boundary fades retain their fixed five-second stepping.
  # Direct minimum-volume conditions are intentionally immediate. When automation
  # returns to a non-urgent target, a guarded handoff advances in fixed five-second
  # steps and aborts if the actual volume no longer matches the previous step.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ apply_volume_follow
                 and (trigger_id in [
                   'startup', 'quiet_start', 'quiet_end',
                   'transition_before_start', 'volume_source',
                   'low_binary_change', 'list_change', 'tts_change',
                   'voice_change', 'night_override_change'
                 ] or bar_became_on) }}
        sequence:
          - repeat:
              for_each: "{{ ultimea_players }}"
              sequence:
                - variables:
                    bar: "{{ repeat.item }}"
                    bar_area: "{{ area_id(repeat.item) or '' }}"
                    binary_low: >-
                      {% set ns = namespace(active=false) %}
                      {% for entity in low_volume_binary_entities %}
                        {% set entity_area = area_id(entity) or '' %}
                        {% if is_state(entity, 'on')
                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                          {% set ns.active = true %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.active }}
                    tts_low: >-
                      {% set ns = namespace(active=false) %}
                      {% for entity in tts_media_players %}
                        {% set entity_area = area_id(entity) or '' %}
                        {% if states(entity) in ['playing', 'buffering']
                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                          {% set ns.active = true %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.active }}
                    voice_low: >-
                      {% set ns = namespace(active=false) %}
                      {% for entity in voice_assistants %}
                        {% set entity_area = area_id(entity) or '' %}
                        {% if states(entity) not in ['idle', 'unknown', 'unavailable']
                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                          {% set ns.active = true %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.active }}
                    night_override_active: >-
                      {% set ns = namespace(active=false) %}
                      {% for entity in night_mode_entities %}
                        {% set entity_area = area_id(entity) or '' %}
                        {% if is_state(entity, 'on')
                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                          {% set ns.active = true %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.active }}
                    list_low: >-
                      {{ '*' in room_list_area_ids
                         or (bar_area != '' and bar_area in room_list_area_ids) }}
                    zone_volume_matches: >-
                      {% set ns = namespace(matches=[]) %}
                      {% set candidates = [zone_volume_entities]
                         if zone_volume_entities is string else zone_volume_entities %}
                      {% if bar_area != '' %}
                        {% for entity in candidates %}
                          {% if (area_id(entity) or '') == bar_area %}
                            {% set ns.matches = ns.matches + [entity] %}
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                      {{ ns.matches }}
                    zone_volume_entity: >-
                      {{ zone_volume_matches[0]
                         if zone_volume_matches | length == 1 else '' }}
                - variables:
                    extra_low: >-
                      {{ binary_low or tts_low or voice_low or night_override_active or list_low }}
                    zone_max_candidate: >-
                      {% if zone_volume_entity %}
                        {% set scale = state_attr(zone_volume_entity, 'max') | float(0) %}
                        {% set fallback = max_volume * 100 if scale > 1.5 else max_volume %}
                        {% set raw = states(zone_volume_entity) | float(fallback) %}
                        {% set normalized = raw / 100 if scale > 1.5 or raw > 1.5 else raw %}
                        {{ [[normalized, 0.0] | max, 1.0] | min }}
                      {% else %}
                        {{ max_volume }}
                      {% endif %}
                    bar_max_volume: >-
                      {{ [min_volume, zone_max_candidate] | max }}
                    bar_scheduled_volume: >-
                      {% if in_quiet_hours %}
                        {{ min_volume }}
                      {% elif before_transition_active and transition_before_seconds > 0 %}
                        {% set progress = 1 - (seconds_until_quiet_start / transition_before_seconds) %}
                        {{ bar_max_volume - ((bar_max_volume - min_volume) * progress) }}
                      {% elif after_transition_active and transition_after_seconds > 0 %}
                        {% set progress = seconds_since_quiet_end / transition_after_seconds %}
                        {{ min_volume + ((bar_max_volume - min_volume) * progress) }}
                      {% else %}
                        {{ bar_max_volume }}
                      {% endif %}
                    bar_previous_scheduled_volume: >-
                      {% if before_transition_active and transition_before_seconds > 0 %}
                        {% set step = ((bar_max_volume - min_volume) * 5 / transition_before_seconds) %}
                        {{ [bar_max_volume, bar_scheduled_volume + step] | min }}
                      {% elif after_transition_active and transition_after_seconds > 0 %}
                        {% set step = ((bar_max_volume - min_volume) * 5 / transition_after_seconds) %}
                        {{ [min_volume, bar_scheduled_volume - step] | max }}
                      {% else %}
                        {{ bar_scheduled_volume }}
                      {% endif %}
                    desired_volume: >-
                      {{ min_volume if extra_low else bar_scheduled_volume }}
                    current_volume: >-
                      {{ state_attr(bar, 'volume_level') | float(-1) }}
                    previous_transition_target: >-
                      {{ bar_previous_scheduled_volume | float(desired_volume) | round(2) }}
                    boundary_retake_allowed: >-
                      {{ trigger_id in ['startup', 'volume_source',
                                        'low_binary_change', 'list_change',
                                        'tts_change', 'voice_change',
                                        'night_override_change']
                         or bar_became_on }}
                    fade_interrupted_by_manual_volume: >-
                      {{ not extra_low
                         and (before_transition_active or after_transition_active)
                         and current_volume >= 0
                         and not boundary_retake_allowed
                         and (current_volume - previous_transition_target) | abs > 0.004 }}
                    fade_can_adjust: >-
                      {{ not (before_transition_active or after_transition_active)
                         or extra_low
                         or not fade_interrupted_by_manual_volume }}
                    guarded_handoff_steps: >-
                      {{ [2, ((handoff_transition_seconds / 5) | round(0, 'ceil') | int) + 1] | max }}
                    guarded_handoff_duration: >-
                      {{ ((guarded_handoff_steps | int) - 1) * 5 }}
                    boundary_handoff_target: >-
                      {% if before_transition_active and transition_before_seconds > 0 %}
                        {% set future_until = [0, seconds_until_quiet_start - guarded_handoff_duration] | max %}
                        {% set progress = 1 - (future_until / transition_before_seconds) %}
                        {{ bar_max_volume - ((bar_max_volume - min_volume) * progress) }}
                      {% elif after_transition_active and transition_after_seconds > 0 %}
                        {% set future_since = [transition_after_seconds, seconds_since_quiet_end + guarded_handoff_duration] | min %}
                        {% set progress = future_since / transition_after_seconds %}
                        {{ min_volume + ((bar_max_volume - min_volume) * progress) }}
                      {% else %}
                        {{ desired_volume }}
                      {% endif %}
                    boundary_guarded_handoff_required: >-
                      {{ not extra_low
                         and (before_transition_active or after_transition_active)
                         and boundary_retake_allowed
                         and current_volume >= 0
                         and (current_volume - boundary_handoff_target) | abs > 0.009 }}
                    guarded_handoff_required: >-
                      {{ not extra_low
                         and current_volume >= 0
                         and (
                           boundary_guarded_handoff_required
                           or (not (before_transition_active or after_transition_active)
                               and (current_volume - desired_volume) | abs > 0.009)
                         ) }}
                    guarded_handoff_target: >-
                      {{ boundary_handoff_target
                         if (before_transition_active or after_transition_active)
                         else desired_volume }}
                - choose:
                    # Urgent ducking remains immediate by design.
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ is_state(bar, 'on') and extra_low
                               and (current_volume < 0 or (current_volume - desired_volume) | abs > 0.009) }}
                      sequence:
                        - action: media_player.volume_set
                          continue_on_error: true
                          target:
                            entity_id: "{{ bar }}"
                          data:
                            volume_level: "{{ [[desired_volume, 0.0] | max, 1.0] | min | round(2) }}"
                    # Normal boundary adjustments remain fixed-step. A manual
                    # mismatch stops the fade unless an explicit policy event is
                    # currently initiating a guarded re-entry below.
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ is_state(bar, 'on')
                               and not extra_low
                               and (before_transition_active or after_transition_active)
                               and not boundary_guarded_handoff_required
                               and fade_can_adjust
                               and (current_volume < 0
                                    or (current_volume - desired_volume) | abs > 0.009) }}
                      sequence:
                        - action: media_player.volume_set
                          continue_on_error: true
                          target:
                            entity_id: "{{ bar }}"
                          data:
                            volume_level: >-
                              {{ [[desired_volume, 0.0] | max, 1.0] | min | round(2) }}
                    # A non-urgent restore, or an explicit re-entry into an active
                    # quiet-boundary fade, completes in one guarded sequence. The
                    # boundary target is projected to where the scheduled fade will
                    # be when the handoff finishes, so the active fade run resumes
                    # on-track without relying on context.parent_id.
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ is_state(bar, 'on') and guarded_handoff_required }}
                      sequence:
                        - variables:
                            handoff_start_volume: "{{ current_volume | float(0) }}"
                            handoff_target_volume: "{{ guarded_handoff_target | float(0) }}"
                            handoff_step_delta: >-
                              {{ (handoff_target_volume - handoff_start_volume)
                                 / (guarded_handoff_steps | int) }}
                        - repeat:
                            count: "{{ guarded_handoff_steps | int }}"
                            sequence:
                              - variables:
                                  handoff_current_volume: >-
                                    {{ state_attr(bar, 'volume_level') | float(-1) }}
                                  handoff_expected_before: >-
                                    {{ handoff_start_volume
                                       + (handoff_step_delta * (repeat.index - 1)) }}
                                  handoff_next_volume: >-
                                    {{ handoff_start_volume
                                       + (handoff_step_delta * repeat.index) }}
                                  handoff_binary_low_now: >-
                                    {% set ns = namespace(active=false) %}
                                    {% for entity in low_volume_binary_entities %}
                                      {% set entity_area = area_id(entity) or '' %}
                                      {% if is_state(entity, 'on')
                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                                        {% set ns.active = true %}
                                      {% endif %}
                                    {% endfor %}
                                    {{ ns.active }}
                                  handoff_tts_low_now: >-
                                    {% set ns = namespace(active=false) %}
                                    {% for entity in tts_media_players %}
                                      {% set entity_area = area_id(entity) or '' %}
                                      {% if states(entity) in ['playing', 'buffering']
                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                                        {% set ns.active = true %}
                                      {% endif %}
                                    {% endfor %}
                                    {{ ns.active }}
                                  handoff_voice_low_now: >-
                                    {% set ns = namespace(active=false) %}
                                    {% for entity in voice_assistants %}
                                      {% set entity_area = area_id(entity) or '' %}
                                      {% if states(entity) not in ['idle', 'unknown', 'unavailable']
                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                                        {% set ns.active = true %}
                                      {% endif %}
                                    {% endfor %}
                                    {{ ns.active }}
                                  handoff_night_low_now: >-
                                    {% set ns = namespace(active=false) %}
                                    {% for entity in night_mode_entities %}
                                      {% set entity_area = area_id(entity) or '' %}
                                      {% if is_state(entity, 'on')
                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                                        {% set ns.active = true %}
                                      {% endif %}
                                    {% endfor %}
                                    {{ ns.active }}
                                  handoff_list_low_now: >-
                                    {% set ns = namespace(active=false) %}
                                    {% for holder in list_state_entities %}
                                      {% set obj = expand(holder) | first %}
                                      {% if obj is not none %}
                                        {% for raw in (obj.state | string).split(',') %}
                                          {% set token = raw | trim %}
                                          {% if token | lower in ['all', '*'] %}
                                            {% set ns.active = true %}
                                          {% elif token and bar_area != '' %}
                                            {% set resolved = token if token in areas() else area_id(token) %}
                                            {% if resolved == bar_area %}
                                              {% set ns.active = true %}
                                            {% endif %}
                                          {% endif %}
                                        {% endfor %}
                                        {% for value in obj.attributes.values() %}
                                          {% if value is string and ',' in value %}
                                            {% for raw in value.split(',') %}
                                              {% set token = raw | trim %}
                                              {% if token | lower in ['all', '*'] %}
                                                {% set ns.active = true %}
                                              {% elif token and bar_area != '' %}
                                                {% set resolved = token if token in areas() else area_id(token) %}
                                                {% if resolved == bar_area %}
                                                  {% set ns.active = true %}
                                                {% endif %}
                                              {% endif %}
                                            {% endfor %}
                                          {% elif value is iterable and value is not string and value is not mapping %}
                                            {% for raw in value %}
                                              {% set token = raw | string | trim %}
                                              {% if token | lower in ['all', '*'] %}
                                                {% set ns.active = true %}
                                              {% elif token and bar_area != '' %}
                                                {% set resolved = token if token in areas() else area_id(token) %}
                                                {% if resolved == bar_area %}
                                                  {% set ns.active = true %}
                                                {% endif %}
                                              {% endif %}
                                            {% endfor %}
                                          {% endif %}
                                        {% endfor %}
                                      {% endif %}
                                    {% endfor %}
                                    {{ ns.active }}
                                  handoff_low_now: >-
                                    {{ handoff_binary_low_now or handoff_tts_low_now
                                       or handoff_voice_low_now or handoff_night_low_now
                                       or handoff_list_low_now }}
                              - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ not is_state(bar, 'on')
                                             or handoff_current_volume < 0 }}
                                    sequence:
                                      - stop: Guarded ULTIMEA handoff stopped because the soundbar is no longer controllable.
                                  - conditions:
                                      - condition: template
                                        value_template: "{{ handoff_low_now }}"
                                    sequence:
                                      - action: media_player.volume_set
                                        continue_on_error: true
                                        target:
                                          entity_id: "{{ bar }}"
                                        data:
                                          volume_level: "{{ [[min_volume, 0.0] | max, 1.0] | min | round(2) }}"
                                      - stop: Guarded ULTIMEA handoff preempted by a minimum-volume condition.
                                  - conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ (handoff_current_volume - handoff_expected_before) | abs > 0.015 }}
                                    sequence:
                                      - stop: Guarded ULTIMEA handoff interrupted by a manual or external volume change.
                              - action: media_player.volume_set
                                continue_on_error: true
                                target:
                                  entity_id: "{{ bar }}"
                                data:
                                  volume_level: >-
                                    {{ [[handoff_next_volume, 0.0] | max, 1.0] | min | round(2) }}
                              - if:
                                  - condition: template
                                    value_template: "{{ repeat.index < (guarded_handoff_steps | int) }}"
                                then:
                                  - delay: "00:00:05"

  # Optional audio-input follow. Selectors are paired strictly by Home Assistant
  # area. The UI entity picker exposes friendly labels but stores stable entity IDs.
  # Unassigned selectors and ambiguous same-area matches are deliberately ignored.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (audio_input_selectors | length > 0)
                 and (trigger_id in ['startup', 'audio_input_change']
                      or bar_became_on) }}
        sequence:
          - repeat:
              for_each: "{{ ultimea_players }}"
              sequence:
                - variables:
                    bar: "{{ repeat.item }}"
                    bar_area: "{{ area_id(repeat.item) or '' }}"
                    source_trigger_affects_bar: >-
                      {% if trigger_id == 'startup' %}
                        true
                      {% elif trigger_id == 'bar_state_change' %}
                        {{ trigger_entity == bar and bar_became_on }}
                      {% elif trigger_id == 'audio_input_change' %}
                        {% set trigger_area = area_id(trigger_entity) or '' %}
                        {{ trigger_area != '' and bar_area != '' and trigger_area == bar_area }}
                      {% else %}
                        false
                      {% endif %}
                    matching_audio_selectors: >-
                      {% set ns = namespace(matches=[]) %}
                      {% set selectors = [audio_input_selectors]
                         if audio_input_selectors is string else audio_input_selectors %}
                      {% if bar_area != '' %}
                        {% for entity in selectors %}
                          {% if (area_id(entity) or '') == bar_area %}
                            {% set ns.matches = ns.matches + [entity] %}
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                      {{ ns.matches }}
                    audio_selector: >-
                      {{ matching_audio_selectors[0]
                         if matching_audio_selectors | length == 1 else '' }}
                    raw_requested_source: >-
                      {{ states(audio_selector) | trim if audio_selector else '' }}
                    requested_source: >-
                      {% set raw = raw_requested_source | trim %}
                      {% set key = raw | lower | replace(' ', '') | replace('-', '') | replace('_', '') %}
                      {% if key in ['earc', 'arc', 'audioreturnchannel', 'enhancedreturnchannel'] %}
                        eARC
                      {% elif key in ['hdmi', 'hdmiin'] %}
                        HDMI
                      {% elif key in ['optical', 'opt', 'spdif', 'toslink'] %}
                        Optical
                      {% elif key in ['aux', 'auxin', 'linein'] %}
                        AUX
                      {% elif key in ['bluetooth', 'bt'] %}
                        Bluetooth
                      {% elif key in ['usb', 'usbin'] %}
                        USB
                      {% elif raw | lower in ['unknown', 'unavailable', 'none', 'no change'] %}
                        {{ '' }}
                      {% else %}
                        {{ raw }}
                      {% endif %}
                    current_source: "{{ state_attr(bar, 'source') or '' }}"
                    supported_sources: "{{ state_attr(bar, 'source_list') | default([], true) }}"
                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ is_state(bar, 'on')
                               and source_trigger_affects_bar
                               and audio_selector != ''
                               and requested_source != ''
                               and requested_source in supported_sources
                               and current_source != requested_source }}
                      sequence:
                        - action: media_player.select_source
                          continue_on_error: true
                          target:
                            entity_id: "{{ bar }}"
                          data:
                            source: "{{ requested_source }}"

  # Optional provider-agnostic content/AI hook. It is intentionally not tied to
  # a specific camera, LLM, vision provider or service contract.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ apply_eq_follow and trigger_id == 'connected_change' }}"
        sequence: !input ai_content_actions

  # Night/EQ policy is event-driven, not continuously enforced. This is
  # deliberate: a manual sound-mode choice is not fought until the room/content
  # context changes again.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger_id in ['startup', 'quiet_start', 'quiet_end',
                                'night_override_change', 'connected_change',
                                'classifier_change']
                 or bar_became_on }}
        sequence:
          - repeat:
              for_each: "{{ ultimea_players }}"
              sequence:
                - variables:
                    bar: "{{ repeat.item }}"
                    bar_area: "{{ area_id(repeat.item) or '' }}"
                    mode_trigger_affects_bar: >-
                      {% if trigger_id in ['startup', 'quiet_start', 'quiet_end'] %}
                        true
                      {% elif trigger_id == 'bar_state_change' %}
                        {{ trigger_entity == bar and bar_became_on }}
                      {% elif trigger_id in ['night_override_change', 'connected_change', 'classifier_change'] %}
                        {% set trigger_area = area_id(trigger_entity) or '' %}
                        {{ trigger_area == '' or (bar_area != '' and trigger_area == bar_area) }}
                      {% else %}
                        false
                      {% endif %}
                    night_override_active: >-
                      {% set ns = namespace(active=false) %}
                      {% for entity in night_mode_entities %}
                        {% set entity_area = area_id(entity) or '' %}
                        {% if is_state(entity, 'on')
                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                          {% set ns.active = true %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.active }}
                    current_sound_mode: "{{ state_attr(bar, 'sound_mode') or '' }}"
                    supported_sound_modes: "{{ state_attr(bar, 'sound_mode_list') | default([], true) }}"
                    content_text: >-
                      {% set ns = namespace(text='') %}
                      {% for entity in connected_media_players %}
                        {% set entity_area = area_id(entity) or '' %}
                        {% if entity_area == '' or (bar_area != '' and entity_area == bar_area) %}
                          {% set ns.text = ns.text ~ ' ' ~ states(entity) %}
                          {% for attr in ['app_name', 'media_title', 'media_series_title',
                                          'media_album_name', 'media_artist',
                                          'media_content_type', 'media_channel',
                                          'media_playlist', 'source'] %}
                            {% set value = state_attr(entity, attr) %}
                            {% if value is not none %}
                              {% set ns.text = ns.text ~ ' ' ~ (value | string) %}
                            {% endif %}
                          {% endfor %}
                        {% endif %}
                      {% endfor %}
                      {% for entity in content_classifier_entities %}
                        {% set entity_area = area_id(entity) or '' %}
                        {% if entity_area == '' or (bar_area != '' and entity_area == bar_area) %}
                          {% set ns.text = ns.text ~ ' ' ~ states(entity) %}
                          {% for attr in ['classification', 'content_type', 'label', 'result'] %}
                            {% set value = state_attr(entity, attr) %}
                            {% if value is not none %}
                              {% set ns.text = ns.text ~ ' ' ~ (value | string) %}
                            {% endif %}
                          {% endfor %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.text | lower }}
                - variables:
                    night_requested: "{{ in_quiet_hours or night_override_active }}"
                    eq_candidate: >-
                      {% set haystack = content_text | lower %}
                      {% set ns = namespace(mode='') %}
                      {% for item in [
                          ('Game', game_keywords),
                          ('Sport', sport_keywords),
                          ('Voice', voice_keywords),
                          ('Music', music_keywords),
                          ('Movie', movie_keywords)
                        ] %}
                        {% if ns.mode == '' %}
                          {% for raw in item[1].split(',') %}
                            {% set keyword = raw | trim | lower %}
                            {% if keyword and keyword in haystack %}
                              {% set ns.mode = item[0] %}
                            {% endif %}
                          {% endfor %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.mode if ns.mode else eq_fallback_mode }}
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ is_state(bar, 'on') and mode_trigger_affects_bar }}"
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ apply_night_mode
                                       and night_requested
                                       and trigger_id in ['startup', 'quiet_start',
                                                          'night_override_change', 'bar_change']
                                       and 'Night' in supported_sound_modes
                                       and current_sound_mode != 'Night' }}
                              sequence:
                                - action: media_player.select_sound_mode
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ bar }}"
                                  data:
                                    sound_mode: Night
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ not (apply_night_mode and night_requested)
                                       and apply_eq_follow
                                       and eq_candidate != 'No change'
                                       and eq_candidate in supported_sound_modes
                                       and current_sound_mode != eq_candidate }}
                              sequence:
                                - action: media_player.select_sound_mode
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ bar }}"
                                  data:
                                    sound_mode: "{{ eq_candidate }}"
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ not (apply_night_mode and night_requested)
                                       and apply_night_mode
                                       and current_sound_mode == 'Night'
                                       and normal_sound_mode != 'No change'
                                       and normal_sound_mode in supported_sound_modes }}
                              sequence:
                                - action: media_player.select_sound_mode
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ bar }}"
                                  data:
                                    sound_mode: "{{ normal_sound_mode }}"


  # Event-driven quiet-boundary fade runner. This block is entered only once when
  # the pre-quiet transition begins, once at quiet_end for the after-transition,
  # or on Home Assistant startup if startup occurs inside an active transition.
  # The five-second cadence below is an internal delay in this single run; there is
  # no time_pattern trigger waking the automation continuously.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ apply_volume_follow
                 and trigger_id in ['transition_before_start', 'quiet_end', 'startup']
                 and (before_transition_active or after_transition_active) }}
        sequence:
          - variables:
              fade_phase: >-
                {{ 'before' if before_transition_active else 'after' }}
              fade_interrupted_bars: []
              fade_policy_grace_seconds: >-
                {{ [10, (handoff_transition_seconds | int) + 10] | max }}
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {% set current_s = now().hour * 3600 + now().minute * 60 + now().second %}
                    {% set until_start = (quiet_start_seconds - current_s + 86400) % 86400 %}
                    {% set since_end = (current_s - quiet_end_seconds + 86400) % 86400 %}
                    {% if fade_phase == 'before' %}
                      {{ transition_before_seconds > 0
                         and 0 < until_start <= transition_before_seconds }}
                    {% else %}
                      {{ transition_after_seconds > 0
                         and since_end < transition_after_seconds }}
                    {% endif %}
              sequence:
                - variables:
                    fade_now_seconds: >-
                      {{ now().hour * 3600 + now().minute * 60 + now().second }}
                    fade_seconds_until_start: >-
                      {{ (quiet_start_seconds - fade_now_seconds + 86400) % 86400 }}
                    fade_seconds_since_end: >-
                      {{ (fade_now_seconds - quiet_end_seconds + 86400) % 86400 }}
                - repeat:
                    for_each: "{{ ultimea_players }}"
                    sequence:
                      - variables:
                          bar: "{{ repeat.item }}"
                          bar_area: "{{ area_id(repeat.item) or '' }}"
                          fade_binary_low: >-
                            {% set ns = namespace(active=false) %}
                            {% for entity in low_volume_binary_entities %}
                              {% set entity_area = area_id(entity) or '' %}
                              {% if is_state(entity, 'on')
                                    and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                                {% set ns.active = true %}
                              {% endif %}
                            {% endfor %}
                            {{ ns.active }}
                          fade_tts_low: >-
                            {% set ns = namespace(active=false) %}
                            {% for entity in tts_media_players %}
                              {% set entity_area = area_id(entity) or '' %}
                              {% if states(entity) in ['playing', 'buffering']
                                    and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                                {% set ns.active = true %}
                              {% endif %}
                            {% endfor %}
                            {{ ns.active }}
                          fade_voice_low: >-
                            {% set ns = namespace(active=false) %}
                            {% for entity in voice_assistants %}
                              {% set entity_area = area_id(entity) or '' %}
                              {% if states(entity) not in ['idle', 'unknown', 'unavailable']
                                    and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                                {% set ns.active = true %}
                              {% endif %}
                            {% endfor %}
                            {{ ns.active }}
                          fade_night_low: >-
                            {% set ns = namespace(active=false) %}
                            {% for entity in night_mode_entities %}
                              {% set entity_area = area_id(entity) or '' %}
                              {% if is_state(entity, 'on')
                                    and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                                {% set ns.active = true %}
                              {% endif %}
                            {% endfor %}
                            {{ ns.active }}
                          fade_list_low: >-
                            {{ '*' in room_list_area_ids
                               or (bar_area != '' and bar_area in room_list_area_ids) }}
                          fade_zone_volume_matches: >-
                            {% set ns = namespace(matches=[]) %}
                            {% set candidates = [zone_volume_entities]
                               if zone_volume_entities is string else zone_volume_entities %}
                            {% if bar_area != '' %}
                              {% for entity in candidates %}
                                {% if (area_id(entity) or '') == bar_area %}
                                  {% set ns.matches = ns.matches + [entity] %}
                                {% endif %}
                              {% endfor %}
                            {% endif %}
                            {{ ns.matches }}
                          fade_zone_volume_entity: >-
                            {{ fade_zone_volume_matches[0]
                               if fade_zone_volume_matches | length == 1 else '' }}
                      - variables:
                          fade_extra_low: >-
                            {{ fade_binary_low or fade_tts_low or fade_voice_low
                               or fade_night_low or fade_list_low }}
                          fade_zone_max_candidate: >-
                            {% if fade_zone_volume_entity %}
                              {% set scale = state_attr(fade_zone_volume_entity, 'max') | float(0) %}
                              {% set fallback = max_volume * 100 if scale > 1.5 else max_volume %}
                              {% set raw = states(fade_zone_volume_entity) | float(fallback) %}
                              {% set normalized = raw / 100 if scale > 1.5 or raw > 1.5 else raw %}
                              {{ [[normalized, 0.0] | max, 1.0] | min }}
                            {% else %}
                              {{ max_volume }}
                            {% endif %}
                          fade_bar_max_volume: >-
                            {{ [min_volume, fade_zone_max_candidate] | max }}
                          fade_scheduled_volume: >-
                            {% if fade_phase == 'before' and transition_before_seconds > 0 %}
                              {% set progress = 1 - (fade_seconds_until_start / transition_before_seconds) %}
                              {{ fade_bar_max_volume
                                 - ((fade_bar_max_volume - min_volume) * progress) }}
                            {% elif fade_phase == 'after' and transition_after_seconds > 0 %}
                              {% set progress = fade_seconds_since_end / transition_after_seconds %}
                              {{ min_volume
                                 + ((fade_bar_max_volume - min_volume) * progress) }}
                            {% else %}
                              {{ min_volume if fade_phase == 'before' else fade_bar_max_volume }}
                            {% endif %}
                          fade_previous_scheduled_volume: >-
                            {% if fade_phase == 'before' and transition_before_seconds > 0 %}
                              {% set step = ((fade_bar_max_volume - min_volume) * 5
                                             / transition_before_seconds) %}
                              {{ [fade_bar_max_volume, fade_scheduled_volume + step] | min }}
                            {% elif fade_phase == 'after' and transition_after_seconds > 0 %}
                              {% set step = ((fade_bar_max_volume - min_volume) * 5
                                             / transition_after_seconds) %}
                              {{ [min_volume, fade_scheduled_volume - step] | max }}
                            {% else %}
                              {{ fade_scheduled_volume }}
                            {% endif %}
                          fade_current_volume: >-
                            {{ state_attr(bar, 'volume_level') | float(-1) }}
                          fade_recent_policy_change: >-
                            {% set cutoff = as_timestamp(now()) - fade_policy_grace_seconds %}
                            {% set ns = namespace(recent=false) %}
                            {% for entity in low_volume_binary_entities
                                 + tts_media_players + voice_assistants + night_mode_entities %}
                              {% set obj = expand(entity) | first %}
                              {% set entity_area = area_id(entity) or '' %}
                              {% if obj is not none
                                    and (entity_area == '' or (bar_area != '' and entity_area == bar_area))
                                    and as_timestamp(obj.last_changed) >= cutoff %}
                                {% set ns.recent = true %}
                              {% endif %}
                            {% endfor %}
                            {% for entity in list_state_entities %}
                              {% set obj = expand(entity) | first %}
                              {% if obj is not none and as_timestamp(obj.last_changed) >= cutoff %}
                                {% set ns.recent = true %}
                              {% endif %}
                            {% endfor %}
                            {% for entity in [min_volume_entity, max_volume_entity, fade_zone_volume_entity] %}
                              {% if entity %}
                                {% set obj = expand(entity) | first %}
                                {% if obj is not none and as_timestamp(obj.last_changed) >= cutoff %}
                                  {% set ns.recent = true %}
                                {% endif %}
                              {% endif %}
                            {% endfor %}
                            {% set bar_obj = expand(bar) | first %}
                            {% if bar_obj is not none
                                  and is_state(bar, 'on')
                                  and as_timestamp(bar_obj.last_changed) >= cutoff %}
                              {% set ns.recent = true %}
                            {% endif %}
                            {{ ns.recent }}
                          fade_manual_mismatch: >-
                            {{ not fade_extra_low
                               and fade_current_volume >= 0
                               and not fade_recent_policy_change
                               and (fade_current_volume
                                    - fade_previous_scheduled_volume) | abs > 0.015 }}
                      - if:
                          - condition: template
                            value_template: >-
                              {{ fade_manual_mismatch and bar not in fade_interrupted_bars }}
                        then:
                          - variables:
                              fade_interrupted_bars: >-
                                {{ fade_interrupted_bars + [bar] }}
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: >-
                                  {{ is_state(bar, 'on')
                                     and bar not in fade_interrupted_bars
                                     and fade_extra_low
                                     and (fade_current_volume < 0
                                          or (fade_current_volume - min_volume) | abs > 0.009) }}
                            sequence:
                              - action: media_player.volume_set
                                continue_on_error: true
                                target:
                                  entity_id: "{{ bar }}"
                                data:
                                  volume_level: "{{ [[min_volume, 0.0] | max, 1.0] | min | round(2) }}"
                          - conditions:
                              - condition: template
                                value_template: >-
                                  {{ is_state(bar, 'on')
                                     and bar not in fade_interrupted_bars
                                     and not fade_extra_low
                                     and not (fade_recent_policy_change
                                              and (fade_current_volume
                                                   - fade_previous_scheduled_volume) | abs > 0.015)
                                     and (fade_current_volume < 0
                                          or (fade_current_volume
                                              - fade_scheduled_volume) | abs > 0.009) }}
                            sequence:
                              - action: media_player.volume_set
                                continue_on_error: true
                                target:
                                  entity_id: "{{ bar }}"
                                data:
                                  volume_level: >-
                                    {{ [[fade_scheduled_volume, 0.0] | max, 1.0] | min | round(2) }}
                - delay: "00:00:05"
          - if:
              - condition: template
                value_template: "{{ fade_phase == 'after' }}"
            then:
              - repeat:
                  for_each: "{{ ultimea_players }}"
                  sequence:
                    - variables:
                        bar: "{{ repeat.item }}"
                        bar_area: "{{ area_id(repeat.item) or '' }}"
                        final_zone_matches: >-
                          {% set ns = namespace(matches=[]) %}
                          {% set candidates = [zone_volume_entities]
                             if zone_volume_entities is string else zone_volume_entities %}
                          {% if bar_area != '' %}
                            {% for entity in candidates %}
                              {% if (area_id(entity) or '') == bar_area %}
                                {% set ns.matches = ns.matches + [entity] %}
                              {% endif %}
                            {% endfor %}
                          {% endif %}
                          {{ ns.matches }}
                        final_zone_entity: >-
                          {{ final_zone_matches[0]
                             if final_zone_matches | length == 1 else '' }}
                        final_low: >-
                          {% set ns = namespace(active=false) %}
                          {% for entity in low_volume_binary_entities %}
                            {% set entity_area = area_id(entity) or '' %}
                            {% if is_state(entity, 'on')
                                  and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                              {% set ns.active = true %}
                            {% endif %}
                          {% endfor %}
                          {% for entity in tts_media_players %}
                            {% set entity_area = area_id(entity) or '' %}
                            {% if states(entity) in ['playing', 'buffering']
                                  and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                              {% set ns.active = true %}
                            {% endif %}
                          {% endfor %}
                          {% for entity in voice_assistants %}
                            {% set entity_area = area_id(entity) or '' %}
                            {% if states(entity) not in ['idle', 'unknown', 'unavailable']
                                  and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                              {% set ns.active = true %}
                            {% endif %}
                          {% endfor %}
                          {% for entity in night_mode_entities %}
                            {% set entity_area = area_id(entity) or '' %}
                            {% if is_state(entity, 'on')
                                  and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}
                              {% set ns.active = true %}
                            {% endif %}
                          {% endfor %}
                          {% if '*' in room_list_area_ids
                                or (bar_area != '' and bar_area in room_list_area_ids) %}
                            {% set ns.active = true %}
                          {% endif %}
                          {{ ns.active }}
                    - variables:
                        final_zone_max_candidate: >-
                          {% if final_zone_entity %}
                            {% set scale = state_attr(final_zone_entity, 'max') | float(0) %}
                            {% set fallback = max_volume * 100 if scale > 1.5 else max_volume %}
                            {% set raw = states(final_zone_entity) | float(fallback) %}
                            {% set normalized = raw / 100 if scale > 1.5 or raw > 1.5 else raw %}
                            {{ [[normalized, 0.0] | max, 1.0] | min }}
                          {% else %}
                            {{ max_volume }}
                          {% endif %}
                        final_target: >-
                          {{ [min_volume, final_zone_max_candidate] | max }}
                        final_current: >-
                          {{ state_attr(bar, 'volume_level') | float(-1) }}
                    - if:
                        - condition: template
                          value_template: >-
                            {{ is_state(bar, 'on')
                               and bar not in fade_interrupted_bars
                               and not final_low
                               and (final_current < 0
                                    or (final_current - final_target) | abs > 0.009) }}
                      then:
                        - action: media_player.volume_set
                          continue_on_error: true
                          target:
                            entity_id: "{{ bar }}"
                          data:
                            volume_level: "{{ [[final_target, 0.0] | max, 1.0] | min | round(2) }}"

mode: parallel
max: 20
max_exceeded: silent
