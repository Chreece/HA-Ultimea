  - trigger: state
    entity_id: !input list_state_entities
    id: minimum_change
  - trigger: state
    entity_id: !input global_list_state_entities
    id: minimum_change
  - trigger: state
    entity_id: !input tts_media_players
    id: minimum_change
  - trigger: state
    entity_id: !input voice_assistants
    id: minimum_change
  - trigger: state
    entity_id: !input zero_binary_entities
