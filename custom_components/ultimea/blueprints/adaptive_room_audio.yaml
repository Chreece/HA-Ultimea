    event: start
    id: startup
  - trigger: time
    at: !input quiet_start
    id: quiet_start
  - trigger: time
    at: !input quiet_end
    id: quiet_end
  - trigger: time_pattern
    seconds: "/5"
    id: transition_tick
    enabled: !input apply_volume_follow
  - trigger: time_pattern
    minutes: "/1"
    seconds: "0"
    id: policy_tick
    enabled: !input apply_volume_follow
  - trigger: state
    entity_id: !input ultimea_players
    id: bar_change
  - trigger: state
    entity_id: !input min_volume_helper
    id: volume_source
  - trigger: state
    entity_id: !input max_volume_helper
    id: volume_source
  - trigger: state
    entity_id: !input boost_amount_entity
    id: boost_amount_change
  - trigger: state
    entity_id: !input low_volume_binary_entities
