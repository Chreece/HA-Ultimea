blueprint:
  name: ULTIMEA Adaptive Room Audio
  description: >-
    Room-aware automation for ULTIMEA soundbars. It can learn a normal and quiet
    volume, lower volume during quiet hours / TTS / active binary conditions /
    Assist activity, fade only around the quiet-hours boundaries, select Night
    mode, and follow the content playing on a connected media player.

    Minimum and maximum volume can be fixed percentages or read from optional
    numeric entities. When manual-volume learning is enabled and the selected
    source is a writable input_number/number entity, a manual volume change in a
    normal or minimum-volume regime updates that endpoint. Manual changes during
    a quiet-hours fade stop the fade for that soundbar instead of being learned.

    The policy engine supports room-scoped and global room-list sources, zero/mute
    overrides, minimum-volume conditions, ambient-noise boosts, connected-device
    activity gates, Night conditions and EQ gates. Every condition group has both
    Home Assistant's rich visual condition editor and a Jinja template alternative.
    Room-list entities may provide comma-separated room tokens in state or list /
    comma-string attributes. Selected devices, media players and labels can define
    what is physically connected to each soundbar.

    EQ follow uses media-player state plus common content attributes such as
    app_name, media_title, media_content_type and source. Optional classifier
    entities can provide labels such as Movie, Music, Voice, Sport or Game. An
    optional action hook can run a snapshot/AI classifier first; the hook is
    provider-agnostic and should update one of the selected classifier entities.
  domain: automation
  source_url: https://github.com/Chreece/HA-Ultimea/blob/master/blueprints/automation/ultimea/adaptive_room_audio.yaml
  homeassistant:
    min_version: 2026.7.0
  input:
    soundbars:
      name: Soundbars and persistent volume limits
      icon: mdi:soundbar
      collapsed: false
      input:
        ultimea_players:
          name: ULTIMEA soundbars
          description: Select the ULTIMEA media_player entities this automation controls.
          selector:
            entity:
              multiple: true
              filter:
                - integration: ultimea
                  domain: media_player
        min_volume_value:
          name: Minimum volume
          description: >-
            Fixed quiet/TTS/Assist volume in percent. Used when no minimum-volume
            entity is selected below.
          default: 20
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        min_volume_helper:
          name: Minimum volume entity (optional)
          description: >-
            Optional numeric entity whose state overrides the fixed minimum above.
            input_number and number entities can also be updated by manual-volume
            learning; sensor entities are read-only. Values may use 0–1 or 0–100.
            Select at most one entity.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_number
                    - number
                    - sensor
        max_volume_value:
          name: Maximum volume
          description: >-
            Fixed normal-operation volume in percent. Used when no maximum-volume
            entity is selected below.
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        max_volume_helper:
          name: Maximum volume entity (optional)
          description: >-
            Optional numeric entity whose state overrides the fixed maximum above.
            input_number and number entities can also be updated by manual-volume
            learning; sensor entities are read-only. Values may use 0–1 or 0–100.
            Select at most one entity.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_number
                    - number
                    - sensor

    quiet_hours:
      name: Quiet hours
      icon: mdi:weather-night
      collapsed: false
      input:
        quiet_start:
          name: Quiet hours start
          default: "22:00:00"
          selector:
            time: {}
        quiet_end:
          name: Quiet hours end
          default: "07:00:00"
          selector:
            time: {}
        transition_before:
          name: Fade before quiet hours
          description: >-
            Time before quiet hours during which volume moves smoothly from the
            learned maximum to the learned minimum.
          default:
            hours: 0
            minutes: 30
            seconds: 0
          selector:
            duration:
              enable_day: false
              enable_second: true
        transition_after:
          name: Fade after quiet hours
          description: >-
            Time after quiet hours during which volume moves smoothly from the
            learned minimum to the learned maximum.
          default:
            hours: 0
            minutes: 30
            seconds: 0
          selector:
            duration:
              enable_day: false
              enable_second: true

    minimum_conditions:
      name: Minimum-volume conditions
      icon: mdi:volume-low
      collapsed: false
      input:
        low_volume_binary_entities:
          name: Binary entities
          description: >-
            On binary_sensor/input_boolean entities request minimum volume for a
            soundbar in the same area. Entities without an area are global.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
        list_state_entities:
          name: Room-scoped room-list entities
          description: >-
            State may contain comma-separated area IDs/names/entity IDs. Attributes
            may be lists or comma-separated strings. Only the matching soundbar
            room is lowered. `all` and `*` still match every bar.
          default: []
          selector:
            entity:
              multiple: true
        global_list_state_entities:
          name: Global room-list entities
          description: >-
            Same parsing as the room-scoped list above, but any valid room token
            makes every selected soundbar request minimum volume. This reproduces
            policies such as "if any sleeping room exists, lower all bars".
          default: []
          selector:
            entity:
              multiple: true
        tts_media_players:
          name: TTS / announcement media players
          description: >-
            A selected media player in playing/buffering state lowers bars in the
            same area. Players without an area are global.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        voice_assistants:
          name: Voice assistants
          description: >-
            A selected Assist Satellite in a non-idle state lowers bars in the
            same area. Satellites without an area are global.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: assist_satellite
        minimum_ha_conditions:
          name: Additional minimum-volume condition
          description: >-
            Optional rich Home Assistant condition editor. Build nested AND/OR,
            state, numeric-state, time, device, zone or template conditions. When
            this list is non-empty and all selected conditions pass, Min is
            requested. Template conditions may use `bar`, `bar_area`,
            `in_quiet_hours`, `min_volume`, `max_volume` and `trigger_id`.
          default: []
          selector:
            condition: {}
        minimum_condition_template:
          name: Minimum-volume template
          description: >-
            Optional Jinja alternative to the visual condition editor. Return true
            to request Min for the current `bar`. `bar_area`, `in_quiet_hours`,
            `min_volume`, `max_volume` and `trigger_id` are available.
          default: "{{ false }}"
          selector:
            template: {}

    zero_conditions:
      name: Zero / mute priority conditions
      icon: mdi:volume-off
      collapsed: true
      input:
        zero_binary_entities:
          name: Zero/mute binary entities
          description: >-
            On binary_sensor/input_boolean entities activate the zero/mute priority
            for the same room; entities without an area are global.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
        zero_room_list_entities:
          name: Zero/mute room-scoped room lists
          description: Room-list sources that affect only matching soundbar rooms.
          default: []
          selector:
            entity:
              multiple: true
        zero_global_list_entities:
          name: Zero/mute global room lists
          description: Any valid room token in these sources affects every selected bar.
          default: []
          selector:
            entity:
              multiple: true
        zero_ha_conditions:
          name: Additional zero/mute condition
          description: >-
            Optional rich Home Assistant condition. If non-empty and true, the
            zero/mute priority activates for the current bar.
          default: []
          selector:
            condition: {}
        zero_condition_template:
          name: Zero/mute template
          description: Return true to activate the zero/mute priority for `bar`.
          default: "{{ false }}"
          selector:
            template: {}
        zero_effect:
          name: Zero/mute effect
          description: Choose how the bar reacts while a zero/mute condition is active.
          default: Volume 0
          selector:
            select:
              options:
      name: Features and manual-control behavior
      icon: mdi:tune-variant
      collapsed: false
      input:
        apply_volume_follow:
          name: Volume follow
          description: Apply min/max, priority conditions, modifiers and quiet-hour fades.
          default: true
          selector:
            boolean: {}
        learn_manual_volume_changes:
          name: Learn min/max from manual volume changes
          description: >-
            When enabled, manual soundbar volume changes update the active minimum
            or maximum only when that endpoint uses a writable input_number/number
            entity. Manual changes during a quiet-hours fade stop the fade and are
            never learned.
          default: false
          selector:
            boolean: {}
        manual_learning_ha_conditions:
          name: Additional manual-learning condition
          description: >-
            Optional rich Home Assistant condition that must pass before a manual
            change can update Min/Max. Empty means no extra restriction.
          default: []
          selector:
            condition: {}
        manual_learning_template:
          name: Manual-learning template
          description: >-
            Template AND-gate for learning. Return true to permit learning for the
            current `bar`. `bar_area`, `manual_volume` and `trigger_id` are available.
          default: "{{ true }}"
          selector:
            template: {}
        apply_night_mode:
          name: Night mode
          description: Select ULTIMEA Night during quiet hours or Night conditions.
          default: true
          selector:
            boolean: {}
        apply_eq_follow:
          name: EQ follow
          description: Select Movie/Music/Voice/Sport/Game from connected content metadata/classification.
          default: false
          selector:
            boolean: {}

