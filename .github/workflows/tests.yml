name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create test virtual environment
        run: python -m venv .venv
      - name: Install test dependencies
        run: .venv/bin/python -m pip install --upgrade pytest pyyaml jinja2
      - name: Compile integration
        run: .venv/bin/python -m compileall -q custom_components/ultimea
      - name: Protocol and blueprint tests
        run: .venv/bin/python -m pytest -q tests
      - name: Validate JSON
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY
