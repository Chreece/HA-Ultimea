name: ULTIMEA blueprint refinement builder

on:
  push:
    branches:
      - dev/adaptive-audio-source-handoff-20260908

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/adaptive-audio-source-handoff-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply narrow Adaptive Room Audio refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          public = ROOT / 'blueprints/automation/ultimea/adaptive_room_audio.yaml'
          bundled = ROOT / 'custom_components/ultimea/blueprints/adaptive_room_audio.yaml'
          text = public.read_text(encoding='utf-8')

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              assert count == 1, f'{label}: expected one match, got {count}'
              return value.replace(old, new, 1)

          # Describe the two refinements without expanding the deferred policy scope.
          text = replace_once(
              text,
              "    The special values `all` and `*` apply globally.\n\n    EQ follow uses media-player state plus common content attributes such as\n",
              "    The special values `all` and `*` apply globally.\n\n    Optional audio-input selector entities are paired to soundbars by Home\n    Assistant area. The entity picker can be searched by friendly name/label;\n    Home Assistant stores the selected entity ID. Exactly one selector must match\n    a soundbar area, so unassigned or ambiguous selectors never act globally.\n\n    Automatic restore/handoff changes use a guarded fixed-step transition. The\n    volume advances every five seconds and stops if the user or another control\n    changes the soundbar away from the expected intermediate value. Direct\n    minimum-volume requests remain immediate.\n\n    EQ follow uses media-player state plus common content attributes such as\n",
              'blueprint description',
          )

          # Add friendly UI-selectable, area-bound source selectors.
          text = replace_once(
              text,
              "        min_volume_value:\n",
              "        audio_input_selectors:\n          name: Audio-input selectors (optional)\n          description: >-\n            Select input_select/select entities used to choose each soundbar's\n            audio source. Home Assistant's entity picker can be searched by the\n            entity's friendly name/label while the blueprint stores its entity ID.\n            Put each selector in the same Home Assistant area as its soundbar.\n            Exactly one selector must match a soundbar area; selectors without an\n            area and ambiguous same-area matches are ignored.\n          default: []\n          selector:\n            entity:\n              multiple: true\n              filter:\n                - domain:\n                    - input_select\n                    - select\n        min_volume_value:\n",
              'audio selector input',
          )

          # Add a configurable guarded handoff duration while keeping 5 s stepping fixed.
          text = replace_once(
              text,
              "        transition_after:\n          name: Fade after quiet hours\n          description: >-\n            Time after quiet hours during which volume moves smoothly from the\n            learned minimum to the learned maximum.\n          default:\n            hours: 0\n            minutes: 30\n            seconds: 0\n          selector:\n            duration:\n              enable_day: false\n              enable_second: true\n\n    low_volume_conditions:\n",
              "        transition_after:\n          name: Fade after quiet hours\n          description: >-\n            Time after quiet hours during which volume moves smoothly from the\n            learned minimum to the learned maximum.\n          default:\n            hours: 0\n            minutes: 30\n            seconds: 0\n          selector:\n            duration:\n              enable_day: false\n              enable_second: true\n        handoff_transition:\n          name: Guarded handoff / restore duration\n          description: >-\n            Duration used when automation control returns to a non-urgent target,\n            for example after ducking ends or after a manually interrupted quiet-\n            hours fade reaches its boundary. The transition always uses fixed\n            five-second steps. If the actual volume stops matching the expected\n            intermediate value, the handoff stops instead of fighting the user.\n            Values shorter than five seconds are clamped to one five-second\n            interval so a handoff never becomes a single abrupt jump.\n          default:\n            hours: 0\n            minutes: 0\n            seconds: 15\n          selector:\n            duration:\n              enable_day: false\n              enable_second: true\n\n    low_volume_conditions:\n",
              'handoff input',
          )

          # Wire new inputs into variables.
          text = replace_once(
              text,
              "variables:\n  ultimea_players: !input ultimea_players\n",
              "variables:\n  ultimea_players: !input ultimea_players\n  audio_input_selectors: !input audio_input_selectors\n",
              'audio selector variable',
          )
          text = replace_once(
              text,
              "  transition_after_value: !input transition_after\n",
              "  transition_after_value: !input transition_after\n  handoff_transition_value: !input handoff_transition\n",
              'handoff variable',
          )

          # Source helper changes are source-only events; they must not implicitly retake volume.
          text = replace_once(
              text,
              "  - trigger: state\n    entity_id: !input max_volume_helper\n    id: volume_source\n",
              "  - trigger: state\n    entity_id: !input max_volume_helper\n    id: volume_source\n  - trigger: state\n    entity_id: !input audio_input_selectors\n    id: audio_input_change\n",
              'audio selector trigger',
          )

          # Parse the handoff duration alongside the existing fixed-step boundary durations.
          text = replace_once(
              text,
              "      transition_after_seconds: >-\n        {{ (transition_after_value.get('hours', 0) | int) * 3600\n           + (transition_after_value.get('minutes', 0) | int) * 60\n           + (transition_after_value.get('seconds', 0) | int) }}\n      min_volume_entity: >-\n",
              "      transition_after_seconds: >-\n        {{ (transition_after_value.get('hours', 0) | int) * 3600\n           + (transition_after_value.get('minutes', 0) | int) * 60\n           + (transition_after_value.get('seconds', 0) | int) }}\n      handoff_transition_seconds: >-\n        {{ (handoff_transition_value.get('hours', 0) | int) * 3600\n           + (handoff_transition_value.get('minutes', 0) | int) * 60\n           + (handoff_transition_value.get('seconds', 0) | int) }}\n      min_volume_entity: >-\n",
              'handoff seconds',
          )

          # Ignore this automation's own intermediate volume states in manual learning.
          text = replace_once(
              text,
              "      bar_became_on: >-\n        {{ trigger_id == 'bar_change'\n",
              "      bar_volume_automation_context: >-\n        {{ bar_volume_changed\n           and trigger.to_state.context.user_id is none\n           and trigger.to_state.context.parent_id is not none }}\n      bar_became_on: >-\n        {{ trigger_id == 'bar_change'\n",
              'automation volume context',
          )
          text = replace_once(
              text,
              "            value_template: \"{{ apply_volume_follow and bar_volume_changed }}\"\n",
              "            value_template: >-\n              {{ apply_volume_follow and bar_volume_changed\n                 and not bar_volume_automation_context }}\n",
              'manual volume guard',
          )

          # Replace only the volume policy block. Urgent minimum-volume requests remain
          # direct; quiet-boundary catch-up is clamped to the normal five-second slope;
          # non-urgent restores use a guarded fixed-step handoff.
          start = text.index("  # Volume policy. The 5-second clock is used only inside a configured quiet\n")
          end = text.index("  # Optional provider-agnostic content/AI hook.", start)
          volume_block = '''  # Volume policy. Quiet-boundary fades retain their fixed five-second stepping.\n  # Direct minimum-volume conditions are intentionally immediate. When automation\n  # returns to a non-urgent target, a guarded handoff advances in fixed five-second\n  # steps and aborts if the actual volume no longer matches the previous step.\n  - choose:\n      - conditions:\n          - condition: template\n            value_template: >-\n              {{ apply_volume_follow\n                 and (\n                   (trigger_id == 'transition_tick'\n                    and (before_transition_active or after_transition_active))\n                   or (trigger_id == 'policy_tick'\n                       and not before_transition_active\n                       and not after_transition_active)\n                   or trigger_id not in ['transition_tick', 'policy_tick',\n                                         'audio_input_change']\n                 ) }}\n        sequence:\n          - repeat:\n              for_each: "{{ ultimea_players }}"\n              sequence:\n                - variables:\n                    bar: "{{ repeat.item }}"\n                    bar_area: "{{ area_id(repeat.item) or '' }}"\n                    binary_low: >-\n                      {% set ns = namespace(active=false) %}\n                      {% for entity in low_volume_binary_entities %}\n                        {% set entity_area = area_id(entity) or '' %}\n                        {% if is_state(entity, 'on')\n                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                          {% set ns.active = true %}\n                        {% endif %}\n                      {% endfor %}\n                      {{ ns.active }}\n                    tts_low: >-\n                      {% set ns = namespace(active=false) %}\n                      {% for entity in tts_media_players %}\n                        {% set entity_area = area_id(entity) or '' %}\n                        {% if states(entity) in ['playing', 'buffering']\n                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                          {% set ns.active = true %}\n                        {% endif %}\n                      {% endfor %}\n                      {{ ns.active }}\n                    voice_low: >-\n                      {% set ns = namespace(active=false) %}\n                      {% for entity in voice_assistants %}\n                        {% set entity_area = area_id(entity) or '' %}\n                        {% if states(entity) not in ['idle', 'unknown', 'unavailable']\n                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                          {% set ns.active = true %}\n                        {% endif %}\n                      {% endfor %}\n                      {{ ns.active }}\n                    night_override_active: >-\n                      {% set ns = namespace(active=false) %}\n                      {% for entity in night_mode_entities %}\n                        {% set entity_area = area_id(entity) or '' %}\n                        {% if is_state(entity, 'on')\n                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                          {% set ns.active = true %}\n                        {% endif %}\n                      {% endfor %}\n                      {{ ns.active }}\n                    list_low: >-\n                      {{ '*' in room_list_area_ids\n                         or (bar_area != '' and bar_area in room_list_area_ids) }}\n                - variables:\n                    extra_low: >-\n                      {{ binary_low or tts_low or voice_low or night_override_active or list_low }}\n                    desired_volume: >-\n                      {{ min_volume if extra_low else scheduled_volume }}\n                    current_volume: >-\n                      {{ state_attr(bar, 'volume_level') | float(-1) }}\n                    previous_transition_target: >-\n                      {{ previous_scheduled_volume | float(desired_volume) | round(2) }}\n                    current_volume_automation_context: >-\n                      {% set obj = expand(bar) | first %}\n                      {{ obj is not none\n                         and obj.context.user_id is none\n                         and obj.context.parent_id is not none }}\n                    fade_interrupted_by_manual_volume: >-\n                      {{ not extra_low\n                         and (before_transition_active or after_transition_active)\n                         and current_volume >= 0\n                         and not current_volume_automation_context\n                         and (current_volume - previous_transition_target) | abs > 0.004 }}\n                    fade_can_adjust: >-\n                      {{ not (before_transition_active or after_transition_active)\n                         or extra_low\n                         or not fade_interrupted_by_manual_volume }}\n                    boundary_step_size: >-\n                      {% if before_transition_active and transition_before_seconds > 0 %}\n                        {{ ((max_volume - min_volume) | abs) * 5 / transition_before_seconds }}\n                      {% elif after_transition_active and transition_after_seconds > 0 %}\n                        {{ ((max_volume - min_volume) | abs) * 5 / transition_after_seconds }}\n                      {% else %}\n                        0\n                      {% endif %}\n                    boundary_step_target: >-\n                      {% if (before_transition_active or after_transition_active)\n                            and current_volume >= 0 %}\n                        {% set step = boundary_step_size | float(0) %}\n                        {% if desired_volume > current_volume %}\n                          {{ [desired_volume, current_volume + step] | min }}\n                        {% else %}\n                          {{ [desired_volume, current_volume - step] | max }}\n                        {% endif %}\n                      {% else %}\n                        {{ desired_volume }}\n                      {% endif %}\n                    guarded_handoff_required: >-\n                      {{ not extra_low\n                         and not (before_transition_active or after_transition_active)\n                         and current_volume >= 0\n                         and (current_volume - desired_volume) | abs > 0.009 }}\n                    guarded_handoff_steps: >-\n                      {{ [2, ((handoff_transition_seconds / 5) | round(0, 'ceil') | int) + 1] | max }}\n                - choose:\n                    # Urgent ducking remains immediate by design.\n                    - conditions:\n                        - condition: template\n                          value_template: >-\n                            {{ is_state(bar, 'on') and extra_low\n                               and (current_volume < 0 or (current_volume - desired_volume) | abs > 0.009) }}\n                      sequence:\n                        - action: media_player.volume_set\n                          continue_on_error: true\n                          target:\n                            entity_id: "{{ bar }}"\n                          data:\n                            volume_level: "{{ [[desired_volume, 0.0] | max, 1.0] | min | round(2) }}"\n                    # A quiet-boundary fade may catch up only one normal five-second\n                    # step at a time. A manual mismatch still stops that fade.\n                    - conditions:\n                        - condition: template\n                          value_template: >-\n                            {{ is_state(bar, 'on')\n                               and not extra_low\n                               and (before_transition_active or after_transition_active)\n                               and fade_can_adjust\n                               and (current_volume < 0\n                                    or (current_volume - boundary_step_target) | abs > 0.009) }}\n                      sequence:\n                        - action: media_player.volume_set\n                          continue_on_error: true\n                          target:\n                            entity_id: "{{ bar }}"\n                          data:\n                            volume_level: >-\n                              {{ [[boundary_step_target, 0.0] | max, 1.0] | min | round(2) }}\n                    # Outside a scheduled boundary fade, restore automation policy\n                    # gradually. Each next step is allowed only if the preceding\n                    # expected volume is still present.\n                    - conditions:\n                        - condition: template\n                          value_template: >-\n                            {{ is_state(bar, 'on') and guarded_handoff_required }}\n                      sequence:\n                        - variables:\n                            handoff_start_volume: "{{ current_volume | float(0) }}"\n                            handoff_target_volume: "{{ desired_volume | float(0) }}"\n                            handoff_step_delta: >-\n                              {{ (handoff_target_volume - handoff_start_volume)\n                                 / (guarded_handoff_steps | int) }}\n                        - repeat:\n                            count: "{{ guarded_handoff_steps | int }}"\n                            sequence:\n                              - variables:\n                                  handoff_current_volume: >-\n                                    {{ state_attr(bar, 'volume_level') | float(-1) }}\n                                  handoff_expected_before: >-\n                                    {{ handoff_start_volume\n                                       + (handoff_step_delta * (repeat.index - 1)) }}\n                                  handoff_next_volume: >-\n                                    {{ handoff_start_volume\n                                       + (handoff_step_delta * repeat.index) }}\n                                  handoff_binary_low_now: >-\n                                    {% set ns = namespace(active=false) %}\n                                    {% for entity in low_volume_binary_entities %}\n                                      {% set entity_area = area_id(entity) or '' %}\n                                      {% if is_state(entity, 'on')\n                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                                        {% set ns.active = true %}\n                                      {% endif %}\n                                    {% endfor %}\n                                    {{ ns.active }}\n                                  handoff_tts_low_now: >-\n                                    {% set ns = namespace(active=false) %}\n                                    {% for entity in tts_media_players %}\n                                      {% set entity_area = area_id(entity) or '' %}\n                                      {% if states(entity) in ['playing', 'buffering']\n                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                                        {% set ns.active = true %}\n                                      {% endif %}\n                                    {% endfor %}\n                                    {{ ns.active }}\n                                  handoff_voice_low_now: >-\n                                    {% set ns = namespace(active=false) %}\n                                    {% for entity in voice_assistants %}\n                                      {% set entity_area = area_id(entity) or '' %}\n                                      {% if states(entity) not in ['idle', 'unknown', 'unavailable']\n                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                                        {% set ns.active = true %}\n                                      {% endif %}\n                                    {% endfor %}\n                                    {{ ns.active }}\n                                  handoff_night_low_now: >-\n                                    {% set ns = namespace(active=false) %}\n                                    {% for entity in night_mode_entities %}\n                                      {% set entity_area = area_id(entity) or '' %}\n                                      {% if is_state(entity, 'on')\n                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                                        {% set ns.active = true %}\n                                      {% endif %}\n                                    {% endfor %}\n                                    {{ ns.active }}\n                                  handoff_low_now: >-\n                                    {{ handoff_binary_low_now or handoff_tts_low_now\n                                       or handoff_voice_low_now or handoff_night_low_now }}\n                              - choose:\n                                  - conditions:\n                                      - condition: template\n                                        value_template: >-\n                                          {{ not is_state(bar, 'on')\n                                             or handoff_current_volume < 0 }}\n                                    sequence:\n                                      - stop: Guarded ULTIMEA handoff stopped because the soundbar is no longer controllable.\n                                  - conditions:\n                                      - condition: template\n                                        value_template: "{{ handoff_low_now }}"\n                                    sequence:\n                                      - action: media_player.volume_set\n                                        continue_on_error: true\n                                        target:\n                                          entity_id: "{{ bar }}"\n                                        data:\n                                          volume_level: "{{ [[min_volume, 0.0] | max, 1.0] | min | round(2) }}"\n                                      - stop: Guarded ULTIMEA handoff preempted by a minimum-volume condition.\n                                  - conditions:\n                                      - condition: template\n                                        value_template: >-\n                                          {{ (handoff_current_volume - handoff_expected_before) | abs > 0.015 }}\n                                    sequence:\n                                      - stop: Guarded ULTIMEA handoff interrupted by a manual or external volume change.\n                              - action: media_player.volume_set\n                                continue_on_error: true\n                                target:\n                                  entity_id: "{{ bar }}"\n                                data:\n                                  volume_level: >-\n                                    {{ [[handoff_next_volume, 0.0] | max, 1.0] | min | round(2) }}\n                              - if:\n                                  - condition: template\n                                    value_template: "{{ repeat.index < (guarded_handoff_steps | int) }}"\n                                then:\n                                  - delay: "00:00:05"\n\n'''
          text = text[:start] + volume_block + text[end:]

          # Add area-bound source follow. No unassigned/global fallback is allowed.
          marker = "  # Optional provider-agnostic content/AI hook."
          source_block = '''  # Optional audio-input follow. Selectors are paired strictly by Home Assistant\n  # area. The UI entity picker exposes friendly labels but stores stable entity IDs.\n  # Unassigned selectors and ambiguous same-area matches are deliberately ignored.\n  - choose:\n      - conditions:\n          - condition: template\n            value_template: >-\n              {{ (audio_input_selectors | length > 0)\n                 and (trigger_id in ['startup', 'audio_input_change']\n                      or bar_became_on) }}\n        sequence:\n          - repeat:\n              for_each: "{{ ultimea_players }}"\n              sequence:\n                - variables:\n                    bar: "{{ repeat.item }}"\n                    bar_area: "{{ area_id(repeat.item) or '' }}"\n                    source_trigger_affects_bar: >-\n                      {% if trigger_id == 'startup' %}\n                        true\n                      {% elif trigger_id == 'bar_change' %}\n                        {{ trigger_entity == bar and bar_became_on }}\n                      {% elif trigger_id == 'audio_input_change' %}\n                        {% set trigger_area = area_id(trigger_entity) or '' %}\n                        {{ trigger_area != '' and bar_area != '' and trigger_area == bar_area }}\n                      {% else %}\n                        false\n                      {% endif %}\n                    matching_audio_selectors: >-\n                      {% set ns = namespace(matches=[]) %}\n                      {% set selectors = [audio_input_selectors]\n                         if audio_input_selectors is string else audio_input_selectors %}\n                      {% if bar_area != '' %}\n                        {% for entity in selectors %}\n                          {% if (area_id(entity) or '') == bar_area %}\n                            {% set ns.matches = ns.matches + [entity] %}\n                          {% endif %}\n                        {% endfor %}\n                      {% endif %}\n                      {{ ns.matches }}\n                    audio_selector: >-\n                      {{ matching_audio_selectors[0]\n                         if matching_audio_selectors | length == 1 else '' }}\n                    raw_requested_source: >-\n                      {{ states(audio_selector) | trim if audio_selector else '' }}\n                    requested_source: >-\n                      {% set raw = raw_requested_source | trim %}\n                      {% set key = raw | lower | replace(' ', '') | replace('-', '') | replace('_', '') %}\n                      {% if key in ['earc', 'arc', 'audioreturnchannel', 'enhancedreturnchannel'] %}\n                        eARC\n                      {% elif key in ['hdmi', 'hdmiin'] %}\n                        HDMI\n                      {% elif key in ['optical', 'opt', 'spdif', 'toslink'] %}\n                        Optical\n                      {% elif key in ['aux', 'auxin', 'linein'] %}\n                        AUX\n                      {% elif key in ['bluetooth', 'bt'] %}\n                        Bluetooth\n                      {% elif key in ['usb', 'usbin'] %}\n                        USB\n                      {% elif raw | lower in ['unknown', 'unavailable', 'none', 'no change'] %}\n                        {{ '' }}\n                      {% else %}\n                        {{ raw }}\n                      {% endif %}\n                    current_source: "{{ state_attr(bar, 'source') or '' }}"\n                    supported_sources: "{{ state_attr(bar, 'source_list') | default([], true) }}"\n                - choose:\n                    - conditions:\n                        - condition: template\n                          value_template: >-\n                            {{ is_state(bar, 'on')\n                               and source_trigger_affects_bar\n                               and audio_selector != ''\n                               and requested_source != ''\n                               and requested_source in supported_sources\n                               and current_source != requested_source }}\n                      sequence:\n                        - action: media_player.select_source\n                          continue_on_error: true\n                          target:\n                            entity_id: "{{ bar }}"\n                          data:\n                            source: "{{ requested_source }}"\n\n'''
          text = text.replace(marker, source_block + marker, 1)

          public.write_text(text, encoding='utf-8')
          bundled.write_text(text, encoding='utf-8')

          # Blueprint regression coverage.
          test_path = ROOT / 'tests/test_blueprint.py'
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              '        "ultimea_players",\n',
              '        "ultimea_players",\n        "audio_input_selectors",\n',
              'test source input',
          )
          tests = replace_once(
              tests,
              '        "transition_after",\n',
              '        "transition_after",\n        "handoff_transition",\n',
              'test handoff input',
          )
          tests = replace_once(
              tests,
              '        assert domains == ["input_number", "number", "sensor"]\n\n\ndef test_blueprint_contains_learning_transition_and_audio_actions() -> None:\n',
              '        assert domains == ["input_number", "number", "sensor"]\n\n    source_selector = inputs["audio_input_selectors"]["selector"]["entity"]\n    assert source_selector["multiple"] is True\n    assert source_selector["filter"][0]["domain"] == ["input_select", "select"]\n    assert inputs["audio_input_selectors"]["default"] == []\n    assert inputs["handoff_transition"]["default"]["seconds"] == 15\n\n\ndef test_blueprint_contains_learning_transition_and_audio_actions() -> None:\n',
              'test selector assertions',
          )
          tests = replace_once(
              tests,
              '        "media_player.select_sound_mode",\n',
              '        "media_player.select_sound_mode",\n        "media_player.select_source",\n',
              'test source action',
          )
          tests = replace_once(
              tests,
              '    assert "fade_can_adjust" in text\n',
              '    assert "fade_can_adjust" in text\n    assert "audio_input_change" in text\n    assert "matching_audio_selectors" in text\n    assert "requested_source" in text\n    assert "source_list" in text\n    assert "bar_volume_automation_context" in text\n    assert "guarded_handoff_required" in text\n    assert "guarded_handoff_steps" in text\n    assert "handoff_expected_before" in text\n    assert "boundary_step_target" in text\n    assert "delay: \\\"00:00:05\\\"" in text\n',
              'test handoff assertions',
          )
          test_path.write_text(tests, encoding='utf-8')

          # Version and changelogs.
          manifest_path = ROOT / 'custom_components/ultimea/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['version'] == '2026.09.08.1'
          manifest['version'] = '2026.09.08.2'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          changelog_path = ROOT / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '''## 2026.09.08.2\n\n### Added\n\n- Added optional area-matched audio-input selector entities. The Home Assistant entity picker can be searched by friendly name/label and accepts both `input_select` and `select`; exactly one same-area selector must match each soundbar, with no unassigned/global fallback.\n- Added a configurable guarded handoff/restore duration. Non-urgent automation retakes are interpolated in fixed five-second steps and stop when the observed volume no longer matches the expected intermediate value.\n\n### Changed\n\n- Quiet-boundary recovery is clamped to the existing five-second fade slope, so returning from an automation-originated duck cannot jump directly to a distant scheduled target.\n- Automation-originated intermediate volume states are excluded from manual-volume learning, while direct minimum-volume requests such as TTS/Assist remain immediate.\n\n'''
          assert '## 2026.09.08.2' not in changelog
          changelog = changelog.replace('## 2026.09.08.1\n', heading + '## 2026.09.08.1\n', 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          (ROOT / 'custom_components/ultimea/CHANGELOG.md').write_text(changelog, encoding='utf-8')

          # README: current release badge + concise capability description + stale helper wording.
          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('release-2026.09.08.1-blue', 'release-2026.09.08.2-blue')
          readme = replace_once(
              readme,
              '- use fixed numeric min/max volume or optional numeric entity sources, with opt-in learning from manual volume changes;\n- apply quiet hours (ώρες κοινής ησυχίας), including smooth before/after boundary fades;\n',
