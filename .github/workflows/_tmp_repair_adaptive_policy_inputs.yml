name: Temporary Adaptive Policy Input Repair

on:
  push:
    branches:
      - feature/adaptive-audio-policy-engine
    paths:
      - .github/workflows/_tmp_repair_adaptive_policy_inputs.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/adaptive-audio-policy-engine
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create repair virtual environment
        run: python -m venv .venv-repair
      - name: Install repair dependencies
        run: .venv-repair/bin/python -m pip install --upgrade pyyaml
      - name: Repair input section
        run: .venv-repair/bin/python scripts/_tmp_repair_adaptive_policy_inputs.py
      - name: Commit repaired blueprint
        shell: bash
        run: |
          git config user.name "Chris Chreece"
          git config user.email "68458228+Chreece@users.noreply.github.com"
          git add blueprints/automation/ultimea/adaptive_room_audio.yaml custom_components/ultimea/blueprints/adaptive_room_audio.yaml
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "Repair Adaptive Room Audio input sections"
          git push origin HEAD:feature/adaptive-audio-policy-engine
