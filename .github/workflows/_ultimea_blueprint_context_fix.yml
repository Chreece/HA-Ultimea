name: ULTIMEA queue-safe handoff hardening

on:
  push:
    branches:
      - dev/adaptive-audio-source-handoff-20260908

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/adaptive-audio-source-handoff-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Harden queued manual-event and boundary handoff logic
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')
          public = ROOT / 'blueprints/automation/ultimea/adaptive_room_audio.yaml'
          bundled = ROOT / 'custom_components/ultimea/blueprints/adaptive_room_audio.yaml'
          text = public.read_text(encoding='utf-8')

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              assert count == 1, f'{label}: expected one match, got {count}'
              return value.replace(old, new, 1)

          # Queued self-generated intermediate volume events can be recognized without
          # relying on Home Assistant context.parent_id: by the time a stale event runs,
          # the live soundbar volume has already advanced beyond trigger.to_state.
          text = replace_once(
              text,
              "      bar_volume_automation_context: >-\n        {{ bar_volume_changed\n           and trigger.to_state.context.user_id is none\n           and trigger.to_state.context.parent_id is not none }}\n      bar_became_on: >-\n",
              "      bar_volume_trigger_is_current: >-\n        {{ bar_volume_changed\n           and state_attr(trigger_entity, 'volume_level') is not none\n           and (state_attr(trigger_entity, 'volume_level') | float(0)\n                - trigger.to_state.attributes.get('volume_level') | float(0)) | abs <= 0.004 }}\n      bar_became_on: >-\n",
              'fresh queued volume guard',
          )
          text = replace_once(
              text,
              "              {{ apply_volume_follow and bar_volume_changed\n                 and not bar_volume_automation_context }}\n",
              "              {{ apply_volume_follow and bar_volume_changed\n                 and bar_volume_trigger_is_current }}\n",
              'manual current-event condition',
          )
          text = replace_once(
              text,
              "  # A volume attribute change on an ULTIMEA media player is special: if it is\n  # not the value this blueprint currently calculates, treat it as a manual\n  # adjustment and learn it into the active endpoint. Self-generated volume\n  # updates match the calculated target and are ignored here.\n",
              "  # A current volume attribute change on an ULTIMEA media player is special:\n  # if it is not the value this blueprint currently calculates, treat it as a\n  # manual adjustment and learn it into the active endpoint. Queued stale events\n  # from intermediate handoff steps are ignored once the live volume has moved on.\n",
              'manual volume comment',
          )

          start = text.index("  # Volume policy. Quiet-boundary fades retain their fixed five-second stepping.\n")
          end = text.index("  # Optional audio-input follow.", start)
          volume_block = '''  # Volume policy. Quiet-boundary fades retain their fixed five-second stepping.\n  # Direct minimum-volume conditions are intentionally immediate. When automation\n  # returns to a non-urgent target, a guarded handoff advances in fixed five-second\n  # steps and aborts if the actual volume no longer matches the previous step.\n  - choose:\n      - conditions:\n          - condition: template\n            value_template: >-\n              {{ apply_volume_follow\n                 and (\n                   (trigger_id == 'transition_tick'\n                    and (before_transition_active or after_transition_active))\n                   or (trigger_id == 'policy_tick'\n                       and not before_transition_active\n                       and not after_transition_active)\n                   or trigger_id not in ['transition_tick', 'policy_tick',\n                                         'audio_input_change']\n                 ) }}\n        sequence:\n          - repeat:\n              for_each: "{{ ultimea_players }}"\n              sequence:\n                - variables:\n                    bar: "{{ repeat.item }}"\n                    bar_area: "{{ area_id(repeat.item) or '' }}"\n                    binary_low: >-\n                      {% set ns = namespace(active=false) %}\n                      {% for entity in low_volume_binary_entities %}\n                        {% set entity_area = area_id(entity) or '' %}\n                        {% if is_state(entity, 'on')\n                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                          {% set ns.active = true %}\n                        {% endif %}\n                      {% endfor %}\n                      {{ ns.active }}\n                    tts_low: >-\n                      {% set ns = namespace(active=false) %}\n                      {% for entity in tts_media_players %}\n                        {% set entity_area = area_id(entity) or '' %}\n                        {% if states(entity) in ['playing', 'buffering']\n                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                          {% set ns.active = true %}\n                        {% endif %}\n                      {% endfor %}\n                      {{ ns.active }}\n                    voice_low: >-\n                      {% set ns = namespace(active=false) %}\n                      {% for entity in voice_assistants %}\n                        {% set entity_area = area_id(entity) or '' %}\n                        {% if states(entity) not in ['idle', 'unknown', 'unavailable']\n                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                          {% set ns.active = true %}\n                        {% endif %}\n                      {% endfor %}\n                      {{ ns.active }}\n                    night_override_active: >-\n                      {% set ns = namespace(active=false) %}\n                      {% for entity in night_mode_entities %}\n                        {% set entity_area = area_id(entity) or '' %}\n                        {% if is_state(entity, 'on')\n                              and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                          {% set ns.active = true %}\n                        {% endif %}\n                      {% endfor %}\n                      {{ ns.active }}\n                    list_low: >-\n                      {{ '*' in room_list_area_ids\n                         or (bar_area != '' and bar_area in room_list_area_ids) }}\n                - variables:\n                    extra_low: >-\n                      {{ binary_low or tts_low or voice_low or night_override_active or list_low }}\n                    desired_volume: >-\n                      {{ min_volume if extra_low else scheduled_volume }}\n                    current_volume: >-\n                      {{ state_attr(bar, 'volume_level') | float(-1) }}\n                    previous_transition_target: >-\n                      {{ previous_scheduled_volume | float(desired_volume) | round(2) }}\n                    boundary_retake_allowed: >-\n                      {{ trigger_id in ['startup', 'volume_source',\n                                        'low_binary_change', 'list_change',\n                                        'tts_change', 'voice_change',\n                                        'night_override_change']\n                         or bar_became_on }}\n                    fade_interrupted_by_manual_volume: >-\n                      {{ not extra_low\n                         and (before_transition_active or after_transition_active)\n                         and current_volume >= 0\n                         and not boundary_retake_allowed\n                         and (current_volume - previous_transition_target) | abs > 0.004 }}\n                    fade_can_adjust: >-\n                      {{ not (before_transition_active or after_transition_active)\n                         or extra_low\n                         or not fade_interrupted_by_manual_volume }}\n                    guarded_handoff_steps: >-\n                      {{ [2, ((handoff_transition_seconds / 5) | round(0, 'ceil') | int) + 1] | max }}\n                    guarded_handoff_duration: >-\n                      {{ ((guarded_handoff_steps | int) - 1) * 5 }}\n                    boundary_handoff_target: >-\n                      {% if before_transition_active and transition_before_seconds > 0 %}\n                        {% set future_until = [0, seconds_until_quiet_start - guarded_handoff_duration] | max %}\n                        {% set progress = 1 - (future_until / transition_before_seconds) %}\n                        {{ max_volume - ((max_volume - min_volume) * progress) }}\n                      {% elif after_transition_active and transition_after_seconds > 0 %}\n                        {% set future_since = [transition_after_seconds, seconds_since_quiet_end + guarded_handoff_duration] | min %}\n                        {% set progress = future_since / transition_after_seconds %}\n                        {{ min_volume + ((max_volume - min_volume) * progress) }}\n                      {% else %}\n                        {{ desired_volume }}\n                      {% endif %}\n                    boundary_guarded_handoff_required: >-\n                      {{ not extra_low\n                         and (before_transition_active or after_transition_active)\n                         and boundary_retake_allowed\n                         and current_volume >= 0\n                         and (current_volume - boundary_handoff_target) | abs > 0.009 }}\n                    guarded_handoff_required: >-\n                      {{ not extra_low\n                         and current_volume >= 0\n                         and (\n                           boundary_guarded_handoff_required\n                           or (not (before_transition_active or after_transition_active)\n                               and (current_volume - desired_volume) | abs > 0.009)\n                         ) }}\n                    guarded_handoff_target: >-\n                      {{ boundary_handoff_target\n                         if (before_transition_active or after_transition_active)\n                         else desired_volume }}\n                - choose:\n                    # Urgent ducking remains immediate by design.\n                    - conditions:\n                        - condition: template\n                          value_template: >-\n                            {{ is_state(bar, 'on') and extra_low\n                               and (current_volume < 0 or (current_volume - desired_volume) | abs > 0.009) }}\n                      sequence:\n                        - action: media_player.volume_set\n                          continue_on_error: true\n                          target:\n                            entity_id: "{{ bar }}"\n                          data:\n                            volume_level: "{{ [[desired_volume, 0.0] | max, 1.0] | min | round(2) }}"\n                    # Normal scheduled boundary ticks remain fixed-step. A manual\n                    # mismatch stops the fade unless an explicit policy event is\n                    # currently initiating a guarded re-entry below.\n                    - conditions:\n                        - condition: template\n                          value_template: >-\n                            {{ is_state(bar, 'on')\n                               and not extra_low\n                               and (before_transition_active or after_transition_active)\n                               and not boundary_guarded_handoff_required\n                               and fade_can_adjust\n                               and (current_volume < 0\n                                    or (current_volume - desired_volume) | abs > 0.009) }}\n                      sequence:\n                        - action: media_player.volume_set\n                          continue_on_error: true\n                          target:\n                            entity_id: "{{ bar }}"\n                          data:\n                            volume_level: >-\n                              {{ [[desired_volume, 0.0] | max, 1.0] | min | round(2) }}\n                    # A non-urgent restore, or an explicit re-entry into an active\n                    # quiet-boundary fade, completes in one guarded sequence. The\n                    # boundary target is projected to where the scheduled fade will\n                    # be when the handoff finishes, so subsequent timer ticks resume\n                    # on-track without relying on context.parent_id.\n                    - conditions:\n                        - condition: template\n                          value_template: >-\n                            {{ is_state(bar, 'on') and guarded_handoff_required }}\n                      sequence:\n                        - variables:\n                            handoff_start_volume: "{{ current_volume | float(0) }}"\n                            handoff_target_volume: "{{ guarded_handoff_target | float(0) }}"\n                            handoff_step_delta: >-\n                              {{ (handoff_target_volume - handoff_start_volume)\n                                 / (guarded_handoff_steps | int) }}\n                        - repeat:\n                            count: "{{ guarded_handoff_steps | int }}"\n                            sequence:\n                              - variables:\n                                  handoff_current_volume: >-\n                                    {{ state_attr(bar, 'volume_level') | float(-1) }}\n                                  handoff_expected_before: >-\n                                    {{ handoff_start_volume\n                                       + (handoff_step_delta * (repeat.index - 1)) }}\n                                  handoff_next_volume: >-\n                                    {{ handoff_start_volume\n                                       + (handoff_step_delta * repeat.index) }}\n                                  handoff_binary_low_now: >-\n                                    {% set ns = namespace(active=false) %}\n                                    {% for entity in low_volume_binary_entities %}\n                                      {% set entity_area = area_id(entity) or '' %}\n                                      {% if is_state(entity, 'on')\n                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                                        {% set ns.active = true %}\n                                      {% endif %}\n                                    {% endfor %}\n                                    {{ ns.active }}\n                                  handoff_tts_low_now: >-\n                                    {% set ns = namespace(active=false) %}\n                                    {% for entity in tts_media_players %}\n                                      {% set entity_area = area_id(entity) or '' %}\n                                      {% if states(entity) in ['playing', 'buffering']\n                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                                        {% set ns.active = true %}\n                                      {% endif %}\n                                    {% endfor %}\n                                    {{ ns.active }}\n                                  handoff_voice_low_now: >-\n                                    {% set ns = namespace(active=false) %}\n                                    {% for entity in voice_assistants %}\n                                      {% set entity_area = area_id(entity) or '' %}\n                                      {% if states(entity) not in ['idle', 'unknown', 'unavailable']\n                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                                        {% set ns.active = true %}\n                                      {% endif %}\n                                    {% endfor %}\n                                    {{ ns.active }}\n                                  handoff_night_low_now: >-\n                                    {% set ns = namespace(active=false) %}\n                                    {% for entity in night_mode_entities %}\n                                      {% set entity_area = area_id(entity) or '' %}\n                                      {% if is_state(entity, 'on')\n                                            and (entity_area == '' or (bar_area != '' and entity_area == bar_area)) %}\n                                        {% set ns.active = true %}\n                                      {% endif %}\n                                    {% endfor %}\n                                    {{ ns.active }}\n                                  handoff_list_low_now: >-\n                                    {% set ns = namespace(active=false) %}\n                                    {% for holder in list_state_entities %}\n                                      {% set obj = expand(holder) | first %}\n                                      {% if obj is not none %}\n                                        {% for raw in (obj.state | string).split(',') %}\n                                          {% set token = raw | trim %}\n                                          {% if token | lower in ['all', '*'] %}\n                                            {% set ns.active = true %}\n                                          {% elif token and bar_area != '' %}\n                                            {% set resolved = token if token in areas() else area_id(token) %}\n                                            {% if resolved == bar_area %}\n                                              {% set ns.active = true %}\n                                            {% endif %}\n                                          {% endif %}\n                                        {% endfor %}\n                                        {% for value in obj.attributes.values() %}\n                                          {% if value is string and ',' in value %}\n                                            {% for raw in value.split(',') %}\n                                              {% set token = raw | trim %}\n                                              {% if token | lower in ['all', '*'] %}\n                                                {% set ns.active = true %}\n                                              {% elif token and bar_area != '' %}\n                                                {% set resolved = token if token in areas() else area_id(token) %}\n                                                {% if resolved == bar_area %}\n                                                  {% set ns.active = true %}\n                                                {% endif %}\n                                              {% endif %}\n                                            {% endfor %}\n                                          {% elif value is iterable and value is not string and value is not mapping %}\n                                            {% for raw in value %}\n                                              {% set token = raw | string | trim %}\n                                              {% if token | lower in ['all', '*'] %}\n                                                {% set ns.active = true %}\n                                              {% elif token and bar_area != '' %}\n                                                {% set resolved = token if token in areas() else area_id(token) %}\n                                                {% if resolved == bar_area %}\n                                                  {% set ns.active = true %}\n                                                {% endif %}\n                                              {% endif %}\n                                            {% endfor %}\n                                          {% endif %}\n                                        {% endfor %}\n                                      {% endif %}\n                                    {% endfor %}\n                                    {{ ns.active }}\n                                  handoff_low_now: >-\n                                    {{ handoff_binary_low_now or handoff_tts_low_now\n                                       or handoff_voice_low_now or handoff_night_low_now\n                                       or handoff_list_low_now }}\n                              - choose:\n                                  - conditions:\n                                      - condition: template\n                                        value_template: >-\n                                          {{ not is_state(bar, 'on')\n                                             or handoff_current_volume < 0 }}\n                                    sequence:\n                                      - stop: Guarded ULTIMEA handoff stopped because the soundbar is no longer controllable.\n                                  - conditions:\n                                      - condition: template\n                                        value_template: "{{ handoff_low_now }}"\n                                    sequence:\n                                      - action: media_player.volume_set\n                                        continue_on_error: true\n                                        target:\n                                          entity_id: "{{ bar }}"\n                                        data:\n                                          volume_level: "{{ [[min_volume, 0.0] | max, 1.0] | min | round(2) }}"\n                                      - stop: Guarded ULTIMEA handoff preempted by a minimum-volume condition.\n                                  - conditions:\n                                      - condition: template\n                                        value_template: >-\n                                          {{ (handoff_current_volume - handoff_expected_before) | abs > 0.015 }}\n                                    sequence:\n                                      - stop: Guarded ULTIMEA handoff interrupted by a manual or external volume change.\n                              - action: media_player.volume_set\n                                continue_on_error: true\n                                target:\n                                  entity_id: "{{ bar }}"\n                                data:\n                                  volume_level: >-\n                                    {{ [[handoff_next_volume, 0.0] | max, 1.0] | min | round(2) }}\n                              - if:\n                                  - condition: template\n                                    value_template: "{{ repeat.index < (guarded_handoff_steps | int) }}"\n                                then:\n                                  - delay: "00:00:05"\n\n'''
          text = text[:start] + volume_block + text[end:]

          public.write_text(text, encoding='utf-8')
          bundled.write_text(text, encoding='utf-8')

          # Update regression assertions to the context-independent queue-safe design.
          test_path = ROOT / 'tests/test_blueprint.py'
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              '    assert "bar_volume_automation_context" in text\n',
              '    assert "bar_volume_trigger_is_current" in text\n',
              'test live queued guard',
          )
          tests = replace_once(
              tests,
              '    assert "boundary_step_target" in text\n',
              '    assert "boundary_retake_allowed" in text\n    assert "boundary_guarded_handoff_required" in text\n    assert "boundary_handoff_target" in text\n    assert "handoff_list_low_now" in text\n',
              'test boundary retake assertions',
          )
          test_path.write_text(tests, encoding='utf-8')

          # Correct explanatory wording so docs do not claim context-based suppression.
          for path in [ROOT / 'CHANGELOG.md', ROOT / 'custom_components/ultimea/CHANGELOG.md']:
              value = path.read_text(encoding='utf-8')
              value = value.replace(
                  '- Automation-originated intermediate volume states are excluded from manual-volume learning, while direct minimum-volume requests such as TTS/Assist remain immediate.',
                  '- Queued stale intermediate handoff volume events are ignored once the live soundbar volume has advanced, preventing self-generated steps from being learned as manual changes; direct minimum-volume requests such as TTS/Assist remain immediate.',
              )
              path.write_text(value, encoding='utf-8')

          for path in [ROOT / 'RELEASE_NOTES_2026.09.08.2.md', ROOT / 'custom_components/ultimea/RELEASE_NOTES_2026.09.08.2.md']:
              value = path.read_text(encoding='utf-8')
              value = value.replace(
                  '- Automation-generated intermediate volume states are excluded from manual-volume learning.',
                  '- Queued stale intermediate volume events are ignored using the current live volume, so the handoff does not depend on `context.parent_id` surviving timer-triggered actions.',
              )
              path.write_text(value, encoding='utf-8')

          docs_path = ROOT / 'docs/ADAPTIVE_AUDIO_BLUEPRINT.md'
          docs = docs_path.read_text(encoding='utf-8')
          docs = docs.replace(
              'The handoff also uses fixed five-second steps and each step is allowed only while the observed volume still matches the previous expected step. A manual/external change therefore aborts the handoff.',
              'The handoff also uses fixed five-second steps and each step is allowed only while the observed volume still matches the previous expected step. A manual/external change therefore aborts the handoff. Queued intermediate volume events are checked against the current live volume, so stale self-generated steps cannot be learned later as manual changes.',
          )
          docs_path.write_text(docs, encoding='utf-8')
          PY
      - name: Test hardened tree
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pytest pyyaml jinja2
          .venv/bin/python -m compileall -q custom_components/ultimea
          .venv/bin/python -m pytest -q tests
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          public = Path('blueprints/automation/ultimea/adaptive_room_audio.yaml').read_bytes()
          bundled = Path('custom_components/ultimea/blueprints/adaptive_room_audio.yaml').read_bytes()
          assert public == bundled
          PY
      - name: Commit tested hardening and remove builder
        run: |
          rm .github/workflows/_ultimea_blueprint_context_fix.yml
          git config user.name "Chris Chreece"
          git config user.email "68458228+Chreece@users.noreply.github.com"
          git add -A
          git commit -m "Harden adaptive audio handoffs against queued stale events"
          git push origin HEAD:dev/adaptive-audio-source-handoff-20260908
