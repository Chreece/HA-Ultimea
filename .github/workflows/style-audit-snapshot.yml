name: Style audit snapshot
on:
  push:
    branches: [style-audit-snapshot-20260905]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8b53854034b4a97d9885c1e33388eb17f4aa8a8e
      - uses: actions/upload-artifact@v4
        with:
          name: ultimea-style-baseline
          retention-days: 1
          include-hidden-files: true
          path: |
            custom_components/
            tests/
            docs/
            .github/workflows/
            CHANGELOG.md
            README.md
            hacs.json
            LICENSE
            RELEASE_NOTES_*.md
