name: Temporary Adaptive Audio Policy Transformer

on:
  push:
    branches:
      - feature/adaptive-audio-policy-engine
    paths:
      - .github/workflows/_tmp_adaptive_policy_engine.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/adaptive-audio-policy-engine
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Transform policy blueprint
        run: python scripts/_tmp_adaptive_policy_engine_transform.py
      - name: Commit transformed files
        shell: bash
        run: |
          git config user.name "Chris Chreece"
          git config user.email "68458228+Chreece@users.noreply.github.com"
          git add blueprints custom_components docs README.md CHANGELOG.md tests RELEASE_NOTES_2026.09.08.2.md
          if git diff --cached --quiet; then
            echo "No transformed changes to commit."
            exit 0
          fi
          git commit -m "Expand Adaptive Room Audio policy engine"
          git push origin HEAD:feature/adaptive-audio-policy-engine
