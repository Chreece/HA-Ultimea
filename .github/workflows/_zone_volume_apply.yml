name: ULTIMEA isolated per-zone volume apply

on:
  push:
    branches:
      - dev/adaptive-zone-volume-20260908

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/adaptive-zone-volume-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply per-zone normal volume source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          manifest_path = ROOT / 'custom_components/ultimea/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest['version'] == '2026.09.08.3':
              print('2026.09.08.3 already applied')
              raise SystemExit(0)
          assert manifest['version'] == '2026.09.08.2', manifest['version']

          public = ROOT / 'blueprints/automation/ultimea/adaptive_room_audio.yaml'
          bundled = ROOT / 'custom_components/ultimea/blueprints/adaptive_room_audio.yaml'
          text = public.read_text(encoding='utf-8')

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              assert count == 1, f'{label}: expected one match, got {count}'
              return value.replace(old, new, 1)

          text = replace_once(
              text,
              "    Optional audio-input selector entities are paired to soundbars by Home\n    Assistant area. The entity picker can be searched by friendly name/label;\n    Home Assistant stores the selected entity ID. Exactly one selector must match\n    a soundbar area, so unassigned or ambiguous selectors never act globally.\n\n    Automatic restore/handoff changes use a guarded fixed-step transition. The\n",
              "    Optional audio-input selector entities are paired to soundbars by Home\n    Assistant area. The entity picker can be searched by friendly name/label;\n    Home Assistant stores the selected entity ID. Exactly one selector must match\n    a soundbar area, so unassigned or ambiguous selectors never act globally.\n\n    Optional per-zone normal-volume entities use the same area matching. Exactly\n    one numeric entity in a soundbar's area overrides the global maximum/normal\n    volume for that soundbar. An input_number helper therefore gives that zone its\n    own persistent dashboard slider. No-area or ambiguous matches fall back to the\n    global maximum, and the quiet/minimum endpoint remains global.\n\n    Automatic restore/handoff changes use a guarded fixed-step transition. The\n",
              'description',
          )

          max_helper = """        max_volume_helper:
          name: Maximum volume entity (optional)
          description: >-
            Optional numeric entity whose state overrides the fixed maximum above.
            input_number and number entities can also be updated by manual-volume
            learning; sensor entities are read-only. Values may use 0–1 or 0–100.
            Select at most one entity.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_number
                    - number
                    - sensor
"""
          zone_helper = """        zone_volume_entities:
          name: Per-zone normal-volume entities (optional)
          description: >-
            Optional numeric entities that override the global maximum/normal
            volume per soundbar area. Put each entity in the same Home Assistant
            area as its soundbar. Exactly one entity must match an area; no-area
            and ambiguous matches fall back to the global maximum above.
            input_number and number entities can learn manual normal-volume changes;
            sensor entities are read-only. Values may use 0–1 or 0–100. An
            input_number helper can be exposed as that zone's dashboard slider.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_number
                    - number
                    - sensor
"""
          text = replace_once(text, max_helper + "\n    quiet_hours:\n", max_helper + zone_helper + "\n    quiet_hours:\n", 'zone input')
          text = replace_once(text, "  max_volume_source_input: !input max_volume_helper\n", "  max_volume_source_input: !input max_volume_helper\n  zone_volume_entities: !input zone_volume_entities\n", 'zone variable')
          text = replace_once(
              text,
              "  - trigger: state\n    entity_id: !input max_volume_helper\n    id: volume_source\n  - trigger: state\n    entity_id: !input audio_input_selectors\n",
              "  - trigger: state\n    entity_id: !input max_volume_helper\n    id: volume_source\n  - trigger: state\n    entity_id: !input zone_volume_entities\n    id: volume_source\n  - trigger: state\n    entity_id: !input audio_input_selectors\n",
              'zone trigger',
          )

          old_manual = """              manual_list_low: >-
                {{ '*' in room_list_area_ids
                   or (manual_bar_area != '' and manual_bar_area in room_list_area_ids) }}
          - variables:
              manual_extra_low: >-
                {{ manual_binary_low or manual_tts_low or manual_voice_low
                   or manual_night_override or manual_list_low }}
              manual_expected_volume: >-
                {{ min_volume if manual_extra_low else scheduled_volume }}
              manual_volume: >-
                {{ trigger.to_state.attributes.get('volume_level') | float(0) }}
              manual_is_low_regime: >-
                {{ in_quiet_hours or manual_extra_low }}
              manual_in_time_transition: >-
                {{ (before_transition_active or after_transition_active) and not manual_extra_low }}
              manual_differs_from_expected: >-
                {{ (manual_volume - manual_expected_volume) | abs > 0.004
                   and (not manual_in_time_transition
                        or (manual_volume - previous_scheduled_volume) | abs > 0.004) }}
              manual_learning_entity: >-
                {{ min_volume_entity if manual_is_low_regime else max_volume_entity }}
"""
          new_manual = """              manual_list_low: >-
                {{ '*' in room_list_area_ids
                   or (manual_bar_area != '' and manual_bar_area in room_list_area_ids) }}
              manual_zone_volume_matches: >-
                {% set ns = namespace(matches=[]) %}
                {% set candidates = [zone_volume_entities]
                   if zone_volume_entities is string else zone_volume_entities %}
                {% if manual_bar_area != '' %}
                  {% for entity in candidates %}
                    {% if (area_id(entity) or '') == manual_bar_area %}
                      {% set ns.matches = ns.matches + [entity] %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
                {{ ns.matches }}
              manual_zone_volume_entity: >-
                {{ manual_zone_volume_matches[0]
                   if manual_zone_volume_matches | length == 1 else '' }}
          - variables:
              manual_extra_low: >-
                {{ manual_binary_low or manual_tts_low or manual_voice_low
                   or manual_night_override or manual_list_low }}
              manual_zone_max_candidate: >-
                {% if manual_zone_volume_entity %}
                  {% set scale = state_attr(manual_zone_volume_entity, 'max') | float(0) %}
                  {% set fallback = max_volume * 100 if scale > 1.5 else max_volume %}
                  {% set raw = states(manual_zone_volume_entity) | float(fallback) %}
                  {% set normalized = raw / 100 if scale > 1.5 or raw > 1.5 else raw %}
                  {{ [[normalized, 0.0] | max, 1.0] | min }}
                {% else %}
                  {{ max_volume }}
                {% endif %}
              manual_max_volume: >-
                {{ [min_volume, manual_zone_max_candidate] | max }}
              manual_scheduled_volume: >-
                {% if in_quiet_hours %}
                  {{ min_volume }}
                {% elif before_transition_active and transition_before_seconds > 0 %}
                  {% set progress = 1 - (seconds_until_quiet_start / transition_before_seconds) %}
                  {{ manual_max_volume - ((manual_max_volume - min_volume) * progress) }}
                {% elif after_transition_active and transition_after_seconds > 0 %}
                  {% set progress = seconds_since_quiet_end / transition_after_seconds %}
                  {{ min_volume + ((manual_max_volume - min_volume) * progress) }}
                {% else %}
                  {{ manual_max_volume }}
                {% endif %}
              manual_previous_scheduled_volume: >-
                {% if before_transition_active and transition_before_seconds > 0 %}
                  {% set step = ((manual_max_volume - min_volume) * 5 / transition_before_seconds) %}
                  {{ [manual_max_volume, manual_scheduled_volume + step] | min }}
                {% elif after_transition_active and transition_after_seconds > 0 %}
                  {% set step = ((manual_max_volume - min_volume) * 5 / transition_after_seconds) %}
                  {{ [min_volume, manual_scheduled_volume - step] | max }}
                {% else %}
                  {{ manual_scheduled_volume }}
                {% endif %}
              manual_expected_volume: >-
                {{ min_volume if manual_extra_low else manual_scheduled_volume }}
              manual_volume: >-
                {{ trigger.to_state.attributes.get('volume_level') | float(0) }}
              manual_is_low_regime: >-
                {{ in_quiet_hours or manual_extra_low }}
              manual_in_time_transition: >-
                {{ (before_transition_active or after_transition_active) and not manual_extra_low }}
              manual_differs_from_expected: >-
                {{ (manual_volume - manual_expected_volume) | abs > 0.004
                   and (not manual_in_time_transition
                        or (manual_volume - manual_previous_scheduled_volume) | abs > 0.004) }}
              manual_learning_entity: >-
                {{ min_volume_entity if manual_is_low_regime
                   else (manual_zone_volume_entity if manual_zone_volume_entity else max_volume_entity) }}
"""
          text = replace_once(text, old_manual, new_manual, 'manual zone policy')

          old_bar = """                    list_low: >-
                      {{ '*' in room_list_area_ids
                         or (bar_area != '' and bar_area in room_list_area_ids) }}
                - variables:
                    extra_low: >-
                      {{ binary_low or tts_low or voice_low or night_override_active or list_low }}
                    desired_volume: >-
                      {{ min_volume if extra_low else scheduled_volume }}
                    current_volume: >-
                      {{ state_attr(bar, 'volume_level') | float(-1) }}
                    previous_transition_target: >-
                      {{ previous_scheduled_volume | float(desired_volume) | round(2) }}
"""
          new_bar = """                    list_low: >-
                      {{ '*' in room_list_area_ids
                         or (bar_area != '' and bar_area in room_list_area_ids) }}
                    zone_volume_matches: >-
                      {% set ns = namespace(matches=[]) %}
                      {% set candidates = [zone_volume_entities]
                         if zone_volume_entities is string else zone_volume_entities %}
                      {% if bar_area != '' %}
                        {% for entity in candidates %}
                          {% if (area_id(entity) or '') == bar_area %}
                            {% set ns.matches = ns.matches + [entity] %}
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                      {{ ns.matches }}
                    zone_volume_entity: >-
                      {{ zone_volume_matches[0]
                         if zone_volume_matches | length == 1 else '' }}
                - variables:
                    extra_low: >-
                      {{ binary_low or tts_low or voice_low or night_override_active or list_low }}
                    zone_max_candidate: >-
                      {% if zone_volume_entity %}
                        {% set scale = state_attr(zone_volume_entity, 'max') | float(0) %}
                        {% set fallback = max_volume * 100 if scale > 1.5 else max_volume %}
                        {% set raw = states(zone_volume_entity) | float(fallback) %}
                        {% set normalized = raw / 100 if scale > 1.5 or raw > 1.5 else raw %}
                        {{ [[normalized, 0.0] | max, 1.0] | min }}
                      {% else %}
                        {{ max_volume }}
                      {% endif %}
                    bar_max_volume: >-
                      {{ [min_volume, zone_max_candidate] | max }}
                    bar_scheduled_volume: >-
                      {% if in_quiet_hours %}
                        {{ min_volume }}
                      {% elif before_transition_active and transition_before_seconds > 0 %}
                        {% set progress = 1 - (seconds_until_quiet_start / transition_before_seconds) %}
                        {{ bar_max_volume - ((bar_max_volume - min_volume) * progress) }}
                      {% elif after_transition_active and transition_after_seconds > 0 %}
                        {% set progress = seconds_since_quiet_end / transition_after_seconds %}
                        {{ min_volume + ((bar_max_volume - min_volume) * progress) }}
                      {% else %}
                        {{ bar_max_volume }}
                      {% endif %}
                    bar_previous_scheduled_volume: >-
                      {% if before_transition_active and transition_before_seconds > 0 %}
                        {% set step = ((bar_max_volume - min_volume) * 5 / transition_before_seconds) %}
                        {{ [bar_max_volume, bar_scheduled_volume + step] | min }}
                      {% elif after_transition_active and transition_after_seconds > 0 %}
                        {% set step = ((bar_max_volume - min_volume) * 5 / transition_after_seconds) %}
                        {{ [min_volume, bar_scheduled_volume - step] | max }}
                      {% else %}
                        {{ bar_scheduled_volume }}
                      {% endif %}
                    desired_volume: >-
                      {{ min_volume if extra_low else bar_scheduled_volume }}
                    current_volume: >-
                      {{ state_attr(bar, 'volume_level') | float(-1) }}
                    previous_transition_target: >-
                      {{ bar_previous_scheduled_volume | float(desired_volume) | round(2) }}
"""
          text = replace_once(text, old_bar, new_bar, 'per-bar zone policy')

          old_boundary = """                    boundary_handoff_target: >-
                      {% if before_transition_active and transition_before_seconds > 0 %}
                        {% set future_until = [0, seconds_until_quiet_start - guarded_handoff_duration] | max %}
                        {% set progress = 1 - (future_until / transition_before_seconds) %}
                        {{ max_volume - ((max_volume - min_volume) * progress) }}
                      {% elif after_transition_active and transition_after_seconds > 0 %}
                        {% set future_since = [transition_after_seconds, seconds_since_quiet_end + guarded_handoff_duration] | min %}
                        {% set progress = future_since / transition_after_seconds %}
                        {{ min_volume + ((max_volume - min_volume) * progress) }}
                      {% else %}
                        {{ desired_volume }}
                      {% endif %}
"""
          new_boundary = old_boundary.replace('max_volume', 'bar_max_volume')
          text = replace_once(text, old_boundary, new_boundary, 'zone-aware boundary handoff')

          public.write_text(text, encoding='utf-8')
          bundled.write_text(text, encoding='utf-8')

          test_path = ROOT / 'tests/test_blueprint.py'
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(tests, '        "max_volume_helper",\n', '        "max_volume_helper",\n        "zone_volume_entities",\n', 'required zone input')
          tests = replace_once(tests, '    for key in ("min_volume_helper", "max_volume_helper"):\n', '    for key in ("min_volume_helper", "max_volume_helper", "zone_volume_entities"):\n', 'zone selector test')
          tests = replace_once(
              tests,
              '    assert "handoff_list_low_now" in text\n',
              '    assert "handoff_list_low_now" in text\n    assert "zone_volume_matches" in text\n    assert "zone_volume_entity" in text\n    assert "manual_zone_volume_entity" in text\n    assert "manual_zone_max_candidate" in text\n    assert "bar_max_volume" in text\n    assert "bar_scheduled_volume" in text\n    assert "manual_scheduled_volume" in text\n',
              'zone regression markers',
          )
          test_path.write_text(tests, encoding='utf-8')

          manifest['version'] = '2026.09.08.3'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          changelog_path = ROOT / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '''## 2026.09.08.3\n\n### Added\n\n- Added optional per-zone normal-volume entities. Exactly one numeric entity in the same Home Assistant area as a soundbar overrides the global maximum/normal volume for that zone; unassigned or ambiguous matches safely fall back to the global maximum.\n- `input_number`/`number` zone volume entities participate in manual normal-volume learning, while sensor-backed zone volumes remain read-only.\n\n### Changed\n\n- Quiet-hour fades and guarded restore/handoff targets now calculate against each soundbar's effective zone maximum while retaining the shared global minimum/quiet endpoint and fixed five-second transition stepping.\n\n'''
          assert '## 2026.09.08.3' not in changelog
          changelog = changelog.replace('## 2026.09.08.2\n', heading + '## 2026.09.08.2\n', 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          (ROOT / 'custom_components/ultimea/CHANGELOG.md').write_text(changelog, encoding='utf-8')

          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('release-2026.09.08.2-blue', 'release-2026.09.08.3-blue')
          readme = replace_once(
              readme,
              '- bind an optional `input_select`/`select` audio-input selector to each soundbar by Home Assistant area; the picker is searchable by friendly label and ambiguous/unassigned selectors are ignored;\n',
              '- bind an optional `input_select`/`select` audio-input selector to each soundbar by Home Assistant area; the picker is searchable by friendly label and ambiguous/unassigned selectors are ignored;\n- give each soundbar area an optional numeric normal-volume entity, such as an `input_number` dashboard slider, with the global maximum used only as fallback;\n',
              'readme zone bullet',
          )
          readme_path.write_text(readme, encoding='utf-8')

          docs_path = ROOT / 'docs/ADAPTIVE_AUDIO_BLUEPRINT.md'
          docs = docs_path.read_text(encoding='utf-8')
          old_docs_intro = '''## Minimum and maximum volume\n\nEach endpoint can be configured as a fixed **0–100%** number and can optionally\nbe overridden by a numeric Home Assistant entity. Supported entity domains are\n`input_number`, `number`, and `sensor`. Entity values may be expressed as either\n`0..1` or `0..100`; the blueprint normalizes them automatically.\n'''
          new_docs_intro = '''## Minimum and maximum volume\n\n### Optional per-zone normal volume\n\nYou can select multiple numeric entities as **Per-zone normal-volume entities**.\nFor each ULTIMEA soundbar, the blueprint looks for exactly one selected numeric\nentity in the same Home Assistant area:\n\n- one match: that value becomes the soundbar's normal/maximum endpoint;\n- no match: the global maximum below is used;\n- more than one match: the area is treated as ambiguous and the global maximum is\n  used rather than guessing;\n- an `input_number` helper is ideal when you want a persistent dashboard slider;\n- writable `input_number`/`number` zone entities can learn manual normal-volume\n  changes when learning is enabled; sensors remain read-only.\n\nThe minimum/quiet endpoint remains global. Quiet-hour fades are calculated from\neach soundbar's effective zone maximum down to that shared minimum, so different\nzones can follow the same quiet-hours policy without sharing their normal volume.\n\nThe shared minimum and global-fallback maximum keep the existing fixed numeric\nvalue plus optional numeric-entity override behavior. Supported domains are\n`input_number`, `number`, and `sensor`, with automatic normalization of 0–1 and\n0–100 values.\n'''
          docs = replace_once(docs, old_docs_intro, new_docs_intro, 'docs zone section')
          docs = docs.replace(
              '- If an automation-originated duck ends while a quiet-boundary fade is already active, recovery is limited to one normal boundary-fade step at a time rather than jumping directly to the current scheduled point.',
              '- If an automation-originated duck ends while a quiet-boundary fade is active, the guarded handoff projects to the point the scheduled fade will reach when the handoff completes; normal fixed five-second boundary ticks resume from there.',
          )
          docs = docs.replace(
              'For different rooms with independent dynamic endpoints, create separate blueprint\ninstances and use separate numeric entities.\n',
              'For fully separate quiet/minimum endpoints or different schedules, create separate\nblueprint instances. Per-zone normal volume no longer requires separate instances.\n',
          )
          docs_path.write_text(docs, encoding='utf-8')

          release_notes = '''# ULTIMEA 2026.09.08.3\n\nThis release adds zone-first normal-volume control to Adaptive Room Audio.\n\n## Per-zone normal volume\n\n- Select any number of `input_number`, `number`, or numeric sensor entities.\n- Put each selected entity in the same Home Assistant area as its ULTIMEA soundbar.\n- Exactly one same-area match overrides the global maximum for that soundbar.\n- No match or multiple matches fall back to the global maximum; nothing is guessed.\n- `input_number` helpers provide persistent dashboard sliders and can learn manual normal-volume changes when learning is enabled.\n- The shared minimum/quiet volume remains global.\n- Quiet-boundary fades and guarded restores calculate against each zone's effective maximum and retain fixed five-second stepping.\n'''
          (ROOT / 'RELEASE_NOTES_2026.09.08.3.md').write_text(release_notes, encoding='utf-8')
          (ROOT / 'custom_components/ultimea/RELEASE_NOTES_2026.09.08.3.md').write_text(release_notes, encoding='utf-8')
          PY
      - name: Test generated source tree
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pytest pyyaml jinja2
          .venv/bin/python -m compileall -q custom_components/ultimea
          .venv/bin/python -m pytest -q tests
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          public = Path('blueprints/automation/ultimea/adaptive_room_audio.yaml').read_bytes()
          bundled = Path('custom_components/ultimea/blueprints/adaptive_room_audio.yaml').read_bytes()
          assert public == bundled
          text = public.decode('utf-8')
          assert 'zone_volume_entities:' in text
          global_schedule = text.split('scheduled_volume: >-', 1)[1].split('previous_scheduled_volume:', 1)[0]
          assert 'max_volume' in global_schedule and 'bar_max_volume' not in global_schedule
          boundary = text.split('boundary_handoff_target: >-', 1)[1].split('boundary_guarded_handoff_required:', 1)[0]
          assert 'bar_max_volume' in boundary
          manifest = json.loads(Path('custom_components/ultimea/manifest.json').read_text())
          assert manifest['version'] == '2026.09.08.3'
          PY
      - name: Commit only source, docs, and tests
        run: |
          git config user.name "Chris Chreece"
          git config user.email "68458228+Chreece@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            README.md \
            RELEASE_NOTES_2026.09.08.3.md \
            blueprints/automation/ultimea/adaptive_room_audio.yaml \
            custom_components/ultimea/CHANGELOG.md \
            custom_components/ultimea/RELEASE_NOTES_2026.09.08.3.md \
            custom_components/ultimea/blueprints/adaptive_room_audio.yaml \
            custom_components/ultimea/manifest.json \
            docs/ADAPTIVE_AUDIO_BLUEPRINT.md \
            tests/test_blueprint.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add optional per-zone normal volume"
          git push origin HEAD:dev/adaptive-zone-volume-20260908
